<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sảnh Phòng Chơi — KỊCH BẢN SÁT V16</title>
  <link rel="stylesheet" href="../src/styles/tokens.css" />
  <link rel="stylesheet" href="../src/styles/base.css" />
  <link rel="stylesheet" href="../src/styles/home.css" />
</head>
<body>
  <div id="app-header"></div>

  <main class="page-shell">
    <div class="container">
      <div class="page-header">
        <div>
          <div class="section-kicker">GHÉP NHÓM TRỰC TUYẾN</div>
          <h1 class="page-title">Sảnh Phòng Chơi</h1>
        </div>
        <a href="./create-room.html" class="btn btn-gold">+ Tạo phòng mới</a>
      </div>

      <div class="tabs-bar">
        <button class="tab-btn active" data-tab="forming">Đang tuyển (Forming)</button>
        <button class="tab-btn" data-tab="confirmed">Đã chốt (Confirmed)</button>
      </div>

      <div style="display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap;">
        <input type="date" id="lobby-date" class="form-control" style="max-width:210px;" />
        <select id="lobby-script" class="form-control" style="max-width:280px;">
          <option value="">Tất cả kịch bản</option>
        </select>
        <button class="btn btn-ghost btn-sm" id="lobby-clear">Xóa lọc</button>
      </div>

      <div class="rooms-grid" id="lobby-grid"></div>
    </div>
  </main>

  <div id="app-footer"></div>

  <script type="module">
    import { store } from '../src/logic/store.js';
    import { initChrome } from '../src/logic/layout.js';

    initChrome('lobby');

    let currentTab = 'forming';
    const scriptSelect = document.getElementById('lobby-script');
    store.state.scripts.slice(0, 15).forEach(s => {
      const opt = document.createElement('option');
      opt.value = s.id;
      opt.textContent = s.title;
      scriptSelect.appendChild(opt);
    });

    function renderLobby() {
      const dateVal = document.getElementById('lobby-date').value;
      const scrVal = scriptSelect.value;

      const rooms = store.state.rooms.filter(r => {
        if (r.status !== currentTab) return false;
        if (dateVal && r.date !== dateVal) return false;
        if (scrVal && r.scriptId !== scrVal) return false;
        return true;
      });

      const grid = document.getElementById('lobby-grid');
      if (rooms.length === 0) {
        grid.innerHTML = `<div style="grid-column:1/-1;padding:36px;text-align:center;background:var(--bg-surface);border-radius:8px;">Không có phòng nào khớp điều kiện lọc hiện tại.</div>`;
        return;
      }

      grid.innerHTML = rooms.map(r => {
        const scr = store.state.scripts.find(s => s.id === r.scriptId) || store.state.scripts[0];
        const filled = r.slots.filter(s => s.name).length;
        const pct = Math.round((filled / r.maxPlayers) * 100);
        const minsLeft = Math.max(15, Math.round((new Date(r.holdExpiresAt) - Date.now()) / 60000));

        return `
          <article class="room-card">
            <div>
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
                <span class="badge ${r.status === 'forming' ? 'badge-green' : 'badge-gold'}">
                  ${r.status === 'forming' ? 'Đang tuyển' : 'Đã chốt đủ'}
                </span>
                <span style="font-family:var(--font-mono);color:var(--gold);font-size:0.82rem;">#${r.id}</span>
              </div>
              <h3 style="font-family:var(--font-display);font-size:1.25rem;margin-bottom:4px;">${scr.title}</h3>
              <p class="text-muted" style="font-size:0.85rem;">Chủ phòng: ${r.hostName}</p>
              <p style="font-size:0.86rem;margin-top:6px;">📅 ${r.date} • ⏰ ${r.timeSlot}</p>
              <p style="font-size:0.8rem;color:var(--gold);margin-top:4px;">⏳ Giữ chỗ còn ~${minsLeft} phút</p>
            </div>
            <div>
              <div style="display:flex;justify-content:space-between;font-size:0.82rem;">
                <span>Tiến độ ghế</span>
                <strong>${filled}/${r.maxPlayers} ghế đã đặt</strong>
              </div>
              <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
              <a href="./room-detail.html?id=${r.id}" class="btn btn-gold btn-sm" style="width:100%;margin-top:14px;">
                Xem chi tiết / Tham gia
              </a>
            </div>
          </article>
        `;
      }).join('');
    }

    document.querySelectorAll('[data-tab]').forEach(btn => {
      btn.addEventListener('click', () => {
        currentTab = btn.dataset.tab;
        document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('active', b === btn));
        renderLobby();
      });
    });

    document.getElementById('lobby-date').addEventListener('change', renderLobby);
    scriptSelect.addEventListener('change', renderLobby);
    document.getElementById('lobby-clear').addEventListener('click', () => {
      document.getElementById('lobby-date').value = '';
      scriptSelect.value = '';
      renderLobby();
    });

    renderLobby();
  </script>
</body>
</html>
