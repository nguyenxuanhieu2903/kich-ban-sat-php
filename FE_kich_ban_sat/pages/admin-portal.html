<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quản Trị Hệ Thống — KỊCH BẢN SÁT V16</title>
  <link rel="stylesheet" href="../src/styles/tokens.css" />
  <link rel="stylesheet" href="../src/styles/base.css" />
</head>
<body>
  <div id="app-header"></div>

  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div style="padding:8px 12px 14px;border-bottom:1px solid rgba(255,255,255,0.08);margin-bottom:6px;">
        <div style="font-size:0.72rem;color:var(--gold);letter-spacing:0.12em;">ADMIN CONSOLE</div>
        <strong>Kịch Bản Sát V16</strong>
      </div>
      <button class="admin-nav-btn active" data-atab="overview">1. Tổng quan</button>
      <button class="admin-nav-btn" data-atab="rooms">2. Điều phối Phòng</button>
      <button class="admin-nav-btn" data-atab="refunds">3. Hoàn cọc (24h)</button>
      <button class="admin-nav-btn" data-atab="scenarios">4. Kho Kịch bản (42)</button>
      <button class="admin-nav-btn" data-atab="physical">5. Phòng vật lý</button>
      <button class="admin-nav-btn" data-atab="users">6. Người dùng &amp; DM</button>
    </aside>

    <main class="admin-main" id="admin-content"></main>
  </div>

  <!-- MODAL THÊM KỊCH BẢN MỚI -->
  <div class="modal-backdrop" id="add-script-modal">
    <div class="paper-ticket modal-box">
      <span class="badge badge-18">THÊM KỊCH BẢN MỚI</span>
      <h3 style="font-family:var(--font-display);font-size:1.45rem;margin:10px 0 14px;">Nhập hồ sơ kịch bản</h3>
      <form id="new-script-form">
        <div class="form-group">
          <label class="form-label">Tên kịch bản *</label>
          <input type="text" id="ns-title" class="form-control" required />
        </div>
        <div class="form-group">
          <label class="form-label">Thể loại</label>
          <input type="text" id="ns-genre" class="form-control" value="Trinh thám / Siêu nhiên" />
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
          <div class="form-group">
            <label class="form-label">Số người tối đa</label>
            <input type="number" id="ns-max" class="form-control" value="7" min="5" max="8" />
          </div>
          <div class="form-group">
            <label class="form-label">Giá vé (VNĐ)</label>
            <input type="number" id="ns-price" class="form-control" value="129000" />
          </div>
        </div>
        <label style="display:flex;align-items:center;gap:8px;margin-bottom:16px;font-size:0.9rem;">
          <input type="checkbox" id="ns-18" /> Gắn nhãn 18+
        </label>
        <div style="display:flex;gap:10px;justify-content:flex-end;">
          <button type="button" class="btn btn-ghost" style="color:#111;border-color:#999;" id="close-ns-modal">Hủy</button>
          <button type="submit" class="btn btn-crimson">Lưu kịch bản</button>
        </div>
      </form>
    </div>
  </div>

  <div id="app-footer"></div>

  <script type="module">
    import { store, formatVND } from '../src/logic/store.js';
    import { initChrome } from '../src/logic/layout.js';

    initChrome('admin');

    let activeTab = window.location.hash.replace('#', '') || 'overview';
    let scenarioPage = 1;
    let scenarioSearch = '';

    function setTab(tab) {
      activeTab = ['overview', 'rooms', 'refunds', 'scenarios', 'physical', 'users'].includes(tab) ? tab : 'overview';
      document.querySelectorAll('[data-atab]').forEach(b => b.classList.toggle('active', b.dataset.atab === activeTab));
      renderAdmin();
    }

    document.querySelectorAll('[data-atab]').forEach(btn => {
      btn.addEventListener('click', () => {
        window.location.hash = btn.dataset.atab;
        setTab(btn.dataset.atab);
      });
    });

    function renderAdmin() {
      const root = document.getElementById('admin-content');

      /* TAB 1: TỔNG QUAN (08a_Admin_Dashboard) */
      if (activeTab === 'overview') {
        const pendingRefunds = store.state.refundRequests.filter(r => r.status === 'pending').length;
        const pendingStudent = store.state.currentUser.studentStatus === 'pending' ? 1 : 0;
        const maxRev = Math.max(...store.state.revenue7Days.map(d => d.amount));
        const topScripts = [...store.state.scripts].sort((a, b) => b.bookingsCount - a.bookingsCount).slice(0, 5);
        const urgentRooms = store.state.rooms.filter(r => !r.assignedDmId);

        root.innerHTML = `
          <h1 class="page-title" style="margin-bottom:20px;">Tổng Quan Vận Hành</h1>

          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:28px;">
            <div style="background:var(--bg-surface);border:1px solid var(--gold-border);padding:20px;border-radius:8px;">
              <div class="text-muted" style="font-size:0.82rem;">Doanh thu tháng</div>
              <div style="font-family:var(--font-display);font-size:1.75rem;color:var(--gold);font-weight:800;">148.650.000đ</div>
            </div>
            <div style="background:var(--bg-surface);border:1px solid rgba(255,255,255,0.1);padding:20px;border-radius:8px;">
              <div class="text-muted" style="font-size:0.82rem;">Phòng hoạt động hôm nay</div>
              <div style="font-family:var(--font-display);font-size:1.75rem;font-weight:800;">${store.state.rooms.length} ca</div>
            </div>
            <div style="background:var(--bg-surface);border:1px solid rgba(255,255,255,0.1);padding:20px;border-radius:8px;">
              <div class="text-muted" style="font-size:0.82rem;">Hoàn cọc chờ duyệt</div>
              <div style="font-family:var(--font-display);font-size:1.75rem;color:var(--crimson-bright);font-weight:800;">${pendingRefunds} yêu cầu</div>
            </div>
            <div style="background:var(--bg-surface);border:1px solid rgba(255,255,255,0.1);padding:20px;border-radius:8px;">
              <div class="text-muted" style="font-size:0.82rem;">Thẻ HSSV chờ xác minh</div>
              <div style="font-family:var(--font-display);font-size:1.75rem;color:#5CD68D;font-weight:800;">${pendingStudent} thẻ</div>
            </div>
          </div>

          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:24px;margin-bottom:28px;">
            <div style="background:var(--bg-surface);border:1px solid rgba(255,255,255,0.1);padding:22px;border-radius:8px;">
              <h3 style="color:var(--gold);margin-bottom:16px;">Biểu đồ doanh thu 7 ngày gần nhất</h3>
              <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:10px;height:180px;padding-top:20px;">
                ${store.state.revenue7Days.map(d => {
                  const hPct = Math.round((d.amount / maxRev) * 100);
                  return `
                    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;">
                      <span style="font-size:0.7rem;color:var(--text-secondary);">${(d.amount / 1000000).toFixed(1)}tr</span>
                      <div style="width:100%;height:${hPct}%;background:linear-gradient(180deg,var(--gold),var(--crimson));border-radius:4px 4px 0 0;"></div>
                      <strong style="font-size:0.8rem;">${d.day}</strong>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>

            <div style="background:var(--bg-surface);border:1px solid rgba(255,255,255,0.1);padding:22px;border-radius:8px;">
              <h3 style="color:var(--gold);margin-bottom:14px;">Top kịch bản đặt nhiều nhất</h3>
              <table class="data-table">
                <thead><tr><th>Kịch bản</th><th>Lượt đặt</th></tr></thead>
                <tbody>
                  ${topScripts.map(s => `<tr><td>${s.title}</td><td><strong class="text-gold">${s.bookingsCount} ca</strong></td></tr>`).join('')}
                </tbody>
              </table>
            </div>
          </div>

          <div style="background:var(--bg-surface);border:1px solid var(--crimson);padding:22px;border-radius:8px;">
            <h3 style="color:var(--crimson-bright);margin-bottom:12px;">Việc cần xử lý gấp</h3>
            <p class="text-muted" style="font-size:0.9rem;">
              • Có <strong>${urgentRooms.length} phòng</strong> sắp chơi chưa gán Quản trò (DM).<br/>
              • Có <strong>${pendingRefunds} yêu cầu hoàn cọc</strong> cần đối chiếu mốc thời gian 24 giờ.
            </p>
          </div>
        `;
      }

      /* TAB 2: ĐIỀU PHỐI PHÒNG (08b_Admin_Rooms) */
      if (activeTab === 'rooms') {
        root.innerHTML = `
          <h1 class="page-title" style="margin-bottom:20px;">Điều Phối Phòng Chơi Trong Ngày</h1>
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr><th>Mã</th><th>Kịch bản</th><th>Giờ</th><th>Khách</th><th>Gán DM</th><th>Phòng vật lý</th><th>Trạng thái</th><th>Hành động</th></tr>
              </thead>
              <tbody>
                ${store.state.rooms.map(r => {
                  const scr = store.state.scripts.find(s => s.id === r.scriptId) || store.state.scripts[0];
                  const filled = r.slots.filter(s => s.name).length;
                  return `
                    <tr>
                      <td><strong class="text-gold">#${r.id}</strong></td>
                      <td>${scr.title}</td>
                      <td>${r.date}<br/><small>${r.timeSlot}</small></td>
                      <td>${filled}/${r.maxPlayers}</td>
                      <td>
                        <select class="form-control" style="padding:6px;font-size:0.82rem;" data-assign-dm="${r.id}">
                          <option value="">-- Chọn DM --</option>
                          ${store.state.dms.map(d => `<option value="${d.id}" ${r.assignedDmId === d.id ? 'selected' : ''}>${d.name}</option>`).join('')}
                        </select>
                      </td>
                      <td>
                        <select class="form-control" style="padding:6px;font-size:0.82rem;" data-assign-pr="${r.id}">
                          <option value="">-- Phòng 01-05 --</option>
                          ${store.state.physicalRooms.map(p => `<option value="${p.id}" ${r.physicalRoomId === p.id ? 'selected' : ''}>${p.name}</option>`).join('')}
                        </select>
                      </td>
                      <td><span class="badge ${r.status === 'completed' ? 'badge-dark' : 'badge-green'}">${r.status}</span></td>
                      <td style="display:flex;gap:6px;">
                        <button class="btn btn-ghost btn-sm" data-reopen="${r.id}">Mở lại</button>
                        <button class="btn btn-crimson btn-sm" data-finish="${r.id}">Kết thúc ca</button>
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        `;

        root.querySelectorAll('[data-assign-dm]').forEach(sel => {
          sel.addEventListener('change', () => {
            const r = store.state.rooms.find(x => x.id === sel.dataset.assignDm);
            if (r) { r.assignedDmId = sel.value; r.dmAcceptStatus = 'pending'; store.save(); }
          });
        });
        root.querySelectorAll('[data-assign-pr]').forEach(sel => {
          sel.addEventListener('change', () => {
            const r = store.state.rooms.find(x => x.id === sel.dataset.assignPr);
            if (r) { r.physicalRoomId = sel.value; store.save(); }
          });
        });
        root.querySelectorAll('[data-reopen]').forEach(b => {
          b.addEventListener('click', () => {
            const r = store.state.rooms.find(x => x.id === b.dataset.reopen);
            if (r) { r.status = 'forming'; store.save(); renderAdmin(); }
          });
        });
        root.querySelectorAll('[data-finish]').forEach(b => {
          b.addEventListener('click', () => {
            const r = store.state.rooms.find(x => x.id === b.dataset.finish);
            if (r) { r.status = 'completed'; store.save(); renderAdmin(); }
          });
        });
      }

      /* TAB 3: DUYỆT HOÀN CỌC 24H (08c_Admin_Refunds) */
      if (activeTab === 'refunds') {
        root.innerHTML = `
          <h1 class="page-title" style="margin-bottom:8px;">Duyệt Hoàn Cọc 50.000đ</h1>
          <p class="text-muted" style="margin-bottom:20px;">Quy tắc: Hủy trước giờ chơi <strong>&gt; 24h</strong> hợp lệ hoàn 100%; dưới <strong>&lt; 24h</strong> từ chối hoàn cọc.</p>
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr><th>Mã YC</th><th>Phòng</th><th>Người chơi</th><th>Mốc thời gian hủy</th><th>Điều kiện 24h</th><th>Trạng thái</th><th>Xử lý</th></tr>
              </thead>
              <tbody>
                ${store.state.refundRequests.map(rf => `
                  <tr style="background:${rf.isEligible ? 'rgba(46,125,79,0.12)' : 'rgba(184,41,41,0.12)'};">
                    <td><strong>${rf.id}</strong></td>
                    <td>#${rf.roomId}</td>
                    <td>${rf.playerName}<br/><small>${rf.phone}</small></td>
                    <td>Trước giờ chơi <strong>${rf.hoursBeforePlay} giờ</strong></td>
                    <td>
                      <span class="badge ${rf.isEligible ? 'badge-green' : 'badge-18'}">
                        ${rf.isEligible ? 'Hợp lệ (> 24h)' : 'Quá hạn (< 24h)'}
                      </span>
                    </td>
                    <td><strong>${rf.status === 'pending' ? 'Chờ duyệt' : rf.status === 'approved' ? 'Đã hoàn 50.000đ' : 'Đã từ chối'}</strong></td>
                    <td>
                      ${rf.status === 'pending' ? (
                        rf.isEligible
                          ? `<button class="btn btn-gold btn-sm" data-rf-ok="${rf.id}">Duyệt hoàn 50.000đ</button>`
                          : `<button class="btn btn-crimson btn-sm" data-rf-no="${rf.id}">Từ chối hoàn cọc</button>`
                      ) : '—'}
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;

        root.querySelectorAll('[data-rf-ok]').forEach(b => {
          b.addEventListener('click', () => {
            const rf = store.state.refundRequests.find(x => x.id === b.dataset.rfOk);
            if (rf) { rf.status = 'approved'; store.save(); renderAdmin(); }
          });
        });
        root.querySelectorAll('[data-rf-no]').forEach(b => {
          b.addEventListener('click', () => {
            const rf = store.state.refundRequests.find(x => x.id === b.dataset.rfNo);
            if (rf) { rf.status = 'rejected'; store.save(); renderAdmin(); }
          });
        });
      }

      /* TAB 4: QUẢN LÝ KHO 42 KỊCH BẢN (08d_Admin_Scenarios) */
      if (activeTab === 'scenarios') {
        const filtered = store.state.scripts.filter(s => s.title.toLowerCase().includes(scenarioSearch.toLowerCase()));
        const perPage = 10;
        const totalPages = Math.ceil(filtered.length / perPage);
        if (scenarioPage > totalPages) scenarioPage = 1;
        const items = filtered.slice((scenarioPage - 1) * perPage, scenarioPage * perPage);

        root.innerHTML = `
          <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px;">
            <h1 class="page-title">Quản Lý Kho Kịch Bản (${filtered.length})</h1>
            <button class="btn btn-gold" id="btn-open-ns">+ Thêm kịch bản mới</button>
          </div>
          <input type="search" id="admin-scr-search" class="form-control" style="max-width:340px;margin-bottom:16px;" placeholder="Tìm kiếm trong 42 kịch bản..." value="${scenarioSearch}" />
          <div class="table-wrap">
            <table class="data-table">
              <thead><tr><th>Mã</th><th>Tên kịch bản</th><th>Số người</th><th>Giá vé</th><th>Nhãn</th><th>Hiển thị</th></tr></thead>
              <tbody>
                ${items.map(s => `
                  <tr>
                    <td>${s.code}</td>
                    <td><strong>${s.title}</strong><br/><small class="text-muted">${s.genre}</small></td>
                    <td>${s.playersMin}–${s.playersMax} người</td>
                    <td>${formatVND(s.price)}</td>
                    <td>${s.is18Plus ? '<span class="badge badge-18">18+</span>' : '<span class="badge badge-dark">Phổ thông</span>'}</td>
                    <td>
                      <label class="switch">
                        <input type="checkbox" data-toggle-scr="${s.id}" ${s.isActive ? 'checked' : ''} />
                        <span class="slider"></span>
                      </label>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
          <div style="display:flex;gap:8px;margin-top:16px;">
            ${Array.from({ length: totalPages }, (_, i) => i + 1).map(p => `
              <button class="btn btn-sm ${p === scenarioPage ? 'btn-gold' : 'btn-ghost'}" data-spage="${p}">${p}</button>
            `).join('')}
          </div>
        `;

        document.getElementById('btn-open-ns').addEventListener('click', () => {
          document.getElementById('add-script-modal').classList.add('open');
        });
        document.getElementById('admin-scr-search').addEventListener('input', e => {
          scenarioSearch = e.target.value;
          scenarioPage = 1;
          renderAdmin();
        });
        root.querySelectorAll('[data-toggle-scr]').forEach(chk => {
          chk.addEventListener('change', () => {
            const s = store.state.scripts.find(x => x.id === chk.dataset.toggleScr);
            if (s) { s.isActive = chk.checked; store.save(); }
          });
        });
        root.querySelectorAll('[data-spage]').forEach(b => {
          b.addEventListener('click', () => { scenarioPage = Number(b.dataset.spage); renderAdmin(); });
        });
      }

      /* TAB 5: PHÒNG VẬT LÝ */
      if (activeTab === 'physical') {
        root.innerHTML = `
          <h1 class="page-title" style="margin-bottom:20px;">Trạng Thái Phòng Vật Lý Tại Quán</h1>
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;">
            ${store.state.physicalRooms.map(p => `
              <div style="background:var(--bg-surface);border:1px solid rgba(255,255,255,0.1);padding:20px;border-radius:8px;">
                <span class="badge ${p.status === 'available' ? 'badge-green' : p.status === 'occupied' ? 'badge-gold' : 'badge-18'}">
                  ${p.status === 'available' ? 'Đang trống' : p.status === 'occupied' ? 'Đang sử dụng' : 'Bảo trì đạo cụ'}
                </span>
                <h3 style="margin:10px 0 6px;">${p.name}</h3>
                <p class="text-muted" style="font-size:0.88rem;">Sức chứa tối đa: ${p.capacity} người</p>
              </div>
            `).join('')}
          </div>
        `;
      }

      /* TAB 6: NGƯỜI DÙNG & DUYỆT THẺ HSSV + QUẢN LÝ DM */
      if (activeTab === 'users') {
        const u = store.state.currentUser;
        root.innerHTML = `
          <h1 class="page-title" style="margin-bottom:20px;">Duyệt Thẻ HSSV &amp; Đội Ngũ Quản Trò (DM)</h1>

          <div class="paper-ticket" style="padding:24px;margin-bottom:28px;">
            <span class="badge badge-18">XÁC MINH ƯU ĐÃI HSSV (-20.000Đ)</span>
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;margin-top:12px;">
              <div>
                <strong>${u.name}</strong> (${u.phone})<br/>
                <span style="font-size:0.86rem;color:var(--ink-muted);">Tệp đính kèm: ${u.studentCardUrl} • Trạng thái: <strong>${u.studentStatus}</strong></span>
              </div>
              <div style="display:flex;gap:8px;">
                <button class="btn btn-gold btn-sm" id="btn-approve-hssv">Duyệt thẻ HSSV</button>
                <button class="btn btn-crimson btn-sm" id="btn-reject-hssv">Từ chối</button>
              </div>
            </div>
          </div>

          <div class="table-wrap">
            <table class="data-table">
              <thead><tr><th>Mã DM</th><th>Họ tên Quản trò</th><th>Chuyên môn</th><th>Đánh giá</th><th>Trạng thái nhận ca</th></tr></thead>
              <tbody>
                ${store.state.dms.map(d => `
                  <tr>
                    <td>${d.id}</td>
                    <td><strong>${d.name}</strong></td>
                    <td>${d.specialty}</td>
                    <td class="text-gold">★ ${d.rating}</td>
                    <td><span class="badge ${d.available ? 'badge-green' : 'badge-dark'}">${d.available ? 'Sẵn sàng' : 'Tạm nghỉ'}</span></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;

        document.getElementById('btn-approve-hssv').addEventListener('click', () => {
          store.approveStudentCard('approved');
          alert('Đã duyệt thẻ HSSV! Người chơi này sẽ tự động được giảm 20.000đ khi đặt phòng T2–T5 (09:00–19:59).');
          renderAdmin();
        });
        document.getElementById('btn-reject-hssv').addEventListener('click', () => {
          store.approveStudentCard('none');
          renderAdmin();
        });
      }
    }

    document.getElementById('close-ns-modal').addEventListener('click', () => {
      document.getElementById('add-script-modal').classList.remove('open');
    });

    document.getElementById('new-script-form').addEventListener('submit', e => {
      e.preventDefault();
      const maxP = Number(document.getElementById('ns-max').value);
      store.state.scripts.unshift({
        id: `SCR-${Date.now().toString().slice(-3)}`,
        code: `KBS-${Math.floor(200 + Math.random() * 700)}`,
        title: document.getElementById('ns-title').value.trim(),
        genre: document.getElementById('ns-genre').value.trim(),
        playersMin: Math.max(5, maxP - 1),
        playersMax: maxP,
        maleCount: Math.ceil(maxP / 2),
        femaleCount: Math.floor(maxP / 2),
        difficulty: 'Trung bình',
        durationHours: 3.5,
        price: Number(document.getElementById('ns-price').value),
        is18Plus: document.getElementById('ns-18').checked,
        isActive: true,
        featured: false,
        bookingsCount: 1,
        summary: 'Kịch bản mới được cập nhật vào kho hồ sơ mật Kịch Bản Sát.',
        hook: 'Mọi manh mối đều dẫn về một cái tên.'
      });
      store.save();
      document.getElementById('add-script-modal').classList.remove('open');
      renderAdmin();
    });

    setTab(activeTab);
  </script>
</body>
