<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tạo Phòng Chơi Mới — KỊCH BẢN SÁT V16</title>
  <link rel="stylesheet" href="../src/styles/tokens.css" />
  <link rel="stylesheet" href="../src/styles/base.css" />
</head>
<body>
  <div id="app-header"></div>

  <main class="page-shell">
    <div class="container">
      <div class="page-header">
        <div>
          <div class="section-kicker">KHỞI TẠO CA PHÁ ÁN</div>
          <h1 class="page-title">Tạo Phòng &amp; Tính Tiền Tự Động</h1>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:28px;">
        <form id="create-room-form" class="paper-ticket" style="padding:28px;">
          <span class="badge badge-18">PHIẾU ĐẶT PHÒNG</span>
          <h2 style="font-family:var(--font-display);font-size:1.5rem;margin:10px 0 18px;">Thông tin lịch chơi</h2>

          <div class="form-group">
            <label class="form-label">Chọn kịch bản *</label>
            <select id="cr-script" class="form-control"></select>
          </div>

          <div class="form-group">
            <label class="form-label">Ngày chơi * <small style="color:var(--crimson);">(Thứ 3 tự động giảm 30%)</small></label>
            <input type="date" id="cr-date" class="form-control" required />
          </div>

          <div class="form-group">
            <label class="form-label">Khung giờ chẵn * <small style="color:var(--success);">(09:00–19:59 T2–T5 áp dụng HSSV -20k)</small></label>
            <select id="cr-time" class="form-control">
              <option value="09:00">09:00 (Ca sáng)</option>
              <option value="11:00">11:00 (Ca trưa)</option>
              <option value="14:00" selected>14:00 (Ca chiều 1)</option>
              <option value="16:00">16:00 (Ca chiều 2)</option>
              <option value="19:00">19:00 (Ca tối 1)</option>
              <option value="21:00">21:00 (Ca đêm)</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Số lượng người đi cùng (1–8 người) *</label>
            <input type="number" id="cr-count" class="form-control" min="1" max="8" value="4" />
          </div>

          <div class="form-group">
            <label class="form-label">Tên chủ phòng *</label>
            <input type="text" id="cr-host" class="form-control" />
          </div>

          <button type="submit" class="btn btn-crimson" style="width:100%;margin-top:8px;">
            Xác nhận tạo phòng &amp; Giữ chỗ 4 giờ
          </button>
        </form>

        <!-- BẢNG TÍNH TIỀN THỜI GIAN THỰC -->
        <div style="background:var(--bg-surface);border:1px solid var(--gold-border);border-radius:10px;padding:28px;height:fit-content;">
          <span class="badge badge-gold">BẢNG TÍNH GIÁ THỜI GIAN THỰC</span>
          <h2 style="font-family:var(--font-display);font-size:1.5rem;margin:10px 0 18px;">Chi tiết chi phí dự kiến</h2>
          <div id="pricing-breakdown" style="display:grid;gap:12px;font-size:0.95rem;"></div>
        </div>
      </div>
    </div>
  </main>

  <div id="app-footer"></div>

  <script type="module">
    import { store, formatVND } from '../src/logic/store.js';
    import { initChrome } from '../src/logic/layout.js';

    initChrome();

    const params = new URLSearchParams(window.location.search);
    const preScript = params.get('scriptId');

    const selScript = document.getElementById('cr-script');
    store.state.scripts.filter(s => s.isActive).forEach(s => {
      const opt = document.createElement('option');
      opt.value = s.id;
      opt.textContent = `${s.title} (${s.playersMin}–${s.playersMax} người • ${formatVND(s.price)})`;
      if (s.id === preScript) opt.selected = true;
      selScript.appendChild(opt);
    });

    // Mặc định chọn Thứ 3 gần nhất để người dùng thấy ngay hiệu ứng giảm 30%
    const d = new Date();
    const diffToTue = (2 - d.getDay() + 7) % 7 || 7;
    d.setDate(d.getDate() + diffToTue);
    document.getElementById('cr-date').value = d.toISOString().split('T')[0];
    document.getElementById('cr-host').value = store.state.currentUser.name;

    function updateBreakdown() {
      const script = store.state.scripts.find(s => s.id === selScript.value) || store.state.scripts[0];
      const dateStr = document.getElementById('cr-date').value;
      const timeSlot = document.getElementById('cr-time').value;
      const playerCount = document.getElementById('cr-count').value;

      const calc = store.calculatePricing({
        basePrice: script.price,
        dateStr,
        timeSlot,
        playerCount
      });

      document.getElementById('pricing-breakdown').innerHTML = `
        <div style="display:flex;justify-content:space-between;">
          <span class="text-muted">Giá gốc kịch bản:</span>
          <strong>${formatVND(calc.basePrice)} / người</strong>
        </div>

        <div style="display:flex;justify-content:space-between;color:${calc.isTuesday ? '#5CD68D' : 'var(--text-dim)'};">
          <span>Ưu đãi Thứ 3 Bí Ẩn (-30%):</span>
          <strong>${calc.isTuesday ? '-' + formatVND(calc.tuesdayDiscountPerPerson) + '/người' : 'Không áp dụng'}</strong>
        </div>

        <div style="display:flex;justify-content:space-between;color:${calc.studentDiscountPerPerson > 0 ? '#5CD68D' : 'var(--text-dim)'};">
          <span>Ưu đãi HSSV (-20.000đ):</span>
          <strong>${
            calc.studentDiscountPerPerson > 0
              ? '-20.000đ/người (Đã duyệt thẻ)'
              : calc.isStudentApproved
                ? 'Ngoài khung 09:00–19:59 T2–T5'
                : 'Thẻ HSSV chưa duyệt'
          }</strong>
        </div>

        <hr style="border-color:rgba(255,255,255,0.1);" />

        <div style="display:flex;justify-content:space-between;">
          <span>Đơn giá thực tế:</span>
          <strong class="text-gold">${formatVND(calc.unitPrice)} × ${calc.count} người</strong>
        </div>

        <div style="display:flex;justify-content:space-between;font-size:1.15rem;">
          <span>Tổng tiền vé:</span>
          <strong>${formatVND(calc.totalTicketAmount)}</strong>
        </div>

        <div style="background:rgba(153,43,43,0.22);border:1px solid var(--crimson);padding:14px;border-radius:6px;margin-top:6px;">
          <div style="display:flex;justify-content:space-between;font-size:1.1rem;color:#fff;">
            <span>Cần cọc ngay (50k × ${calc.count}):</span>
            <strong class="text-gold">${formatVND(calc.totalDeposit)}</strong>
          </div>
          <div style="font-size:0.82rem;color:var(--text-secondary);margin-top:4px;">
            Thanh toán còn lại tại quán: ${formatVND(calc.remainingAtVenue)} • Giữ chỗ trong 4 giờ.
          </div>
        </div>
      `;
    }

    ['cr-script', 'cr-date', 'cr-time', 'cr-count'].forEach(id => {
      document.getElementById(id).addEventListener('change', updateBreakdown);
      document.getElementById(id).addEventListener('input', updateBreakdown);
    });
    updateBreakdown();

    document.getElementById('create-room-form').addEventListener('submit', e => {
      e.preventDefault();
      const room = store.createRoom({
        scriptId: selScript.value,
        date: document.getElementById('cr-date').value,
        timeSlot: document.getElementById('cr-time').value,
        playerCount: document.getElementById('cr-count').value,
        hostName: document.getElementById('cr-host').value.trim()
      });
      window.location.href = `./booking-status.html?id=${room.id}`;
    });
  </script>
</body>
</html>
