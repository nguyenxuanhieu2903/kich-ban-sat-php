<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chi tiết Kịch bản — KỊCH BẢN SÁT V16</title>
  <link rel="stylesheet" href="../src/styles/tokens.css" />
  <link rel="stylesheet" href="../src/styles/base.css" />
</head>
<body>
  <div id="app-header"></div>

  <main class="page-shell">
    <div class="container" id="detail-root"></div>
  </main>

  <!-- POPUP 18+ BẮT BUỘC KHI TRUY CẬP TRỰC TIẾP -->
  <div class="modal-backdrop" id="age-gate">
    <div class="paper-ticket modal-box">
      <span class="badge badge-18">CẢNH BÁO ĐỘ TUỔI 18+</span>
      <h3 style="font-family:var(--font-display);font-size:1.5rem;margin:12px 0 8px;">Xác nhận đủ 18 tuổi</h3>
      <p style="font-size:0.92rem;color:var(--ink-muted);margin-bottom:20px;">
        Hồ sơ vụ án này có yếu tố kinh dị/tâm lý 18+. Bạn xác nhận mình đã đủ 18 tuổi để tiếp tục?
      </p>
      <div style="display:flex;gap:10px;justify-content:flex-end;">
        <a href="./scenarios.html" class="btn btn-ghost" style="color:var(--ink-black);border-color:#999;">Quay lại kho</a>
        <button class="btn btn-crimson" id="btn-gate-pass">Tôi đã đủ 18 tuổi</button>
      </div>
    </div>
  </div>

  <div id="app-footer"></div>

  <script type="module">
    import { store, formatVND } from '../src/logic/store.js';
    import { initChrome } from '../src/logic/layout.js';

    initChrome('scenarios');

    const params = new URLSearchParams(window.location.search);
    const id = params.get('id') || 'SCR-01';
    const script = store.state.scripts.find(s => s.id === id) || store.state.scripts[0];

    if (script.is18Plus) {
      const gate = document.getElementById('age-gate');
      gate.classList.add('open');
      document.getElementById('btn-gate-pass').addEventListener('click', () => gate.classList.remove('open'));
    }

    const openRooms = store.state.rooms.filter(r => r.scriptId === script.id);
    const tuesdayPrice = Math.round(script.price * 0.7);

    document.getElementById('detail-root').innerHTML = `
      <a href="./scenarios.html" class="text-gold" style="display:inline-block;margin-bottom:18px;">← Quay lại kho 42 kịch bản</a>

      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:28px;margin-bottom:44px;">
        <div style="background:linear-gradient(155deg,#261212,#12100E);border:1px solid var(--gold-border);border-radius:12px;padding:32px;display:flex;flex-direction:column;justify-content:space-between;min-height:340px;">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <span class="badge badge-gold">${script.code}</span>
            ${script.is18Plus ? '<span class="badge badge-18">18+</span>' : ''}
          </div>
          <div style="margin:24px 0;">
            <div style="font-family:var(--font-display);font-size:4.5rem;color:rgba(212,175,55,0.22);line-height:1;">${script.title.charAt(0)}</div>
            <h1 style="font-family:var(--font-display);font-size:2.1rem;margin-top:8px;">${script.title}</h1>
            <p style="color:var(--gold);margin-top:6px;">${script.genre}</p>
          </div>
          <blockquote style="border-left:3px solid var(--crimson);padding-left:12px;font-style:italic;color:var(--paper-cream);">
            “${script.hook}”
          </blockquote>
        </div>

        <div class="paper-ticket" style="padding:30px;">
          <span class="badge badge-18">THÔNG SỐ HỒ SƠ</span>
          <h2 style="font-family:var(--font-display);font-size:1.55rem;margin:10px 0 12px;">Tóm tắt vụ án</h2>
          <p style="color:var(--ink-black);line-height:1.65;margin-bottom:20px;">${script.summary}</p>

          <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:16px;background:var(--paper-aged);border-radius:6px;margin-bottom:20px;font-size:0.9rem;">
            <div>👥 <strong>Số người:</strong> ${script.playersMin}–${script.playersMax} (${script.maleCount} Nam / ${script.femaleCount} Nữ)</div>
            <div>⏱️ <strong>Thời lượng:</strong> ~${String(script.durationHours).replace('.', ',')} giờ</div>
            <div>🧩 <strong>Độ khó:</strong> ${script.difficulty}</div>
            <div>💰 <strong>Cọc giữ chỗ:</strong> 50.000đ/người</div>
          </div>

          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:20px;">
            <div>
              <div style="font-size:0.82rem;color:var(--ink-muted);">Giá vé tiêu chuẩn / Thứ 3 (-30%)</div>
              <strong style="font-size:1.35rem;color:var(--crimson);">${formatVND(script.price)}</strong>
              <span style="font-size:0.9rem;color:var(--success);font-weight:700;"> (Thứ 3: ${formatVND(tuesdayPrice)})</span>
            </div>
            <a href="./create-room.html?scriptId=${script.id}" class="btn btn-crimson">Tạo phòng với kịch bản này</a>
          </div>
        </div>
      </div>

      <h2 style="font-family:var(--font-display);font-size:1.6rem;margin-bottom:16px;">Phòng đang mở cho kịch bản "${script.title}" (${openRooms.length})</h2>
      ${openRooms.length === 0 ? `
        <div style="background:var(--bg-surface);padding:24px;border-radius:8px;border:1px solid rgba(255,255,255,0.08);">
          Hiện chưa có phòng ghép nào mở cho kịch bản này. <a href="./create-room.html?scriptId=${script.id}" class="text-gold" style="text-decoration:underline;">Tạo phòng đầu tiên ngay →</a>
        </div>
      ` : `
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr><th>Mã phòng</th><th>Chủ phòng</th><th>Lịch chơi</th><th>Slot</th><th>Trạng thái</th><th></th></tr>
            </thead>
            <tbody>
              ${openRooms.map(r => {
                const filled = r.slots.filter(s => s.name).length;
                return `
                  <tr>
                    <td><strong class="text-gold">#${r.id}</strong></td>
                    <td>${r.hostName}</td>
                    <td>${r.date} • ${r.timeSlot}</td>
                    <td><strong>${filled}/${r.maxPlayers}</strong> người</td>
                    <td><span class="badge ${r.status === 'forming' ? 'badge-green' : 'badge-gold'}">${r.status === 'forming' ? 'Đang tuyển' : 'Đã chốt'}</span></td>
                    <td><a href="./room-detail.html?id=${r.id}" class="btn btn-gold btn-sm">Tham gia ngay</a></td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      `}
    `;
  </script>
</body>
</html>
