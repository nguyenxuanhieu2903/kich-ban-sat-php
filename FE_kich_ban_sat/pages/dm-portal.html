<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cổng Quản Trò (DM) — KỊCH BẢN SÁT V16</title>
  <link rel="stylesheet" href="../src/styles/tokens.css" />
  <link rel="stylesheet" href="../src/styles/base.css" />
</head>
<body>
  <div id="app-header"></div>

  <main class="page-shell">
    <div class="container">
      <!-- THANH TRẠNG THÁI ĐẦU TRANG -->
      <div style="background:var(--bg-surface);border:1px solid var(--gold-border);border-radius:10px;padding:18px 22px;margin-bottom:24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;">
        <div>
          <span class="badge badge-gold">QUẢN TRÒ (DM)</span>
          <h1 style="font-family:var(--font-display);font-size:1.5rem;margin-top:4px;" id="dm-name-title">Quản trò Hoàng Nam</h1>
        </div>
        <label style="display:flex;align-items:center;gap:10px;cursor:pointer;">
          <span id="dm-avail-label" style="font-weight:600;color:#5CD68D;">Sẵn sàng nhận lịch dẫn ca</span>
          <span class="switch">
            <input type="checkbox" id="dm-avail-switch" checked />
            <span class="slider"></span>
          </span>
        </label>
      </div>

      <!-- 07a: 3 TAB CÔNG VIỆC -->
      <div class="tabs-bar">
        <button class="tab-btn active" data-dmtab="new">Yêu cầu dẫn ca mới</button>
        <button class="tab-btn" data-dmtab="upcoming">Lịch dẫn sắp tới</button>
        <button class="tab-btn" data-dmtab="history">Lịch sử đã dẫn</button>
      </div>

      <div id="dm-list" style="display:grid;gap:14px;margin-bottom:36px;"></div>

      <!-- 07b: CHI TIẾT CA DẪN & BẢNG ĐIỂM DANH MOBILE 375PX -->
      <section id="session-detail" style="background:var(--bg-surface);border:1px solid rgba(255,255,255,0.12);border-radius:10px;padding:22px;">
        <div id="session-detail-content"></div>
      </section>
    </div>
  </main>

  <div id="app-footer"></div>

  <script type="module">
    import { store } from '../src/logic/store.js';
    import { initChrome } from '../src/logic/layout.js';

    initChrome('dm');

    const dm = store.state.dms[0];
    let dmTab = 'new';
    let selectedRoomId = store.state.rooms[0]?.id;

    const availSwitch = document.getElementById('dm-avail-switch');
    const availLabel = document.getElementById('dm-avail-label');
    availSwitch.checked = dm.available;
    availSwitch.addEventListener('change', () => {
      dm.available = availSwitch.checked;
      availLabel.textContent = dm.available ? 'Sẵn sàng nhận lịch dẫn ca' : 'Đang tạm nghỉ nhận ca';
      availLabel.style.color = dm.available ? '#5CD68D' : 'var(--text-dim)';
      store.save();
    });

    function renderDmDashboard() {
      const rooms = store.state.rooms.filter(r => {
        if (dmTab === 'new') return r.dmAcceptStatus === 'pending';
        if (dmTab === 'upcoming') return r.dmAcceptStatus === 'accepted' && r.status !== 'completed';
        return r.status === 'completed';
      });

      const listEl = document.getElementById('dm-list');
      if (rooms.length === 0) {
        listEl.innerHTML = `<div style="padding:24px;background:var(--bg-surface);border-radius:8px;" class="text-muted">Không có ca dẫn nào trong mục này.</div>`;
      } else {
        listEl.innerHTML = rooms.map(r => {
          const scr = store.state.scripts.find(s => s.id === r.scriptId) || store.state.scripts[0];
          const pRoom = store.state.physicalRooms.find(p => p.id === r.physicalRoomId);
          return `
            <div style="background:var(--bg-surface);border:1px solid rgba(212,175,55,0.22);border-radius:8px;padding:18px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;">
              <div>
                <strong class="text-gold">#${r.id}</strong> — <strong>${scr.title}</strong>
                <div class="text-muted" style="font-size:0.86rem;">📅 ${r.date} • ⏰ ${r.timeSlot} • ${pRoom ? pRoom.name : 'Chưa gán phòng vật lý'}</div>
              </div>
              <div style="display:flex;gap:8px;flex-wrap:wrap;">
                ${dmTab === 'new' ? `
                  <button class="btn btn-gold btn-sm" data-accept="${r.id}">Chấp nhận</button>
                  <button class="btn btn-ghost btn-sm" data-reject="${r.id}">Từ chối</button>
                ` : ''}
                <a href="#session-detail" class="btn btn-crimson btn-sm" data-inspect="${r.id}">Điểm danh Check-in</a>
              </div>
            </div>
          `;
        }).join('');
      }

      listEl.querySelectorAll('[data-accept]').forEach(b => {
        b.addEventListener('click', () => {
          const r = store.state.rooms.find(item => item.id === b.dataset.accept);
          if (r) { r.dmAcceptStatus = 'accepted'; r.assignedDmId = dm.id; store.save(); renderDmDashboard(); }
        });
      });
      listEl.querySelectorAll('[data-reject]').forEach(b => {
        b.addEventListener('click', () => {
          const r = store.state.rooms.find(item => item.id === b.dataset.reject);
          if (r) { r.dmAcceptStatus = 'rejected'; store.save(); renderDmDashboard(); }
        });
      });
      listEl.querySelectorAll('[data-inspect]').forEach(b => {
        b.addEventListener('click', () => {
          selectedRoomId = b.dataset.inspect;
          renderSessionDetail();
        });
      });
    }

    function renderSessionDetail() {
      const room = store.state.rooms.find(r => r.id === selectedRoomId) || store.state.rooms[0];
      const scr = store.state.scripts.find(s => s.id === room.scriptId) || store.state.scripts[0];
      const pRoom = store.state.physicalRooms.find(p => p.id === room.physicalRoomId);
      const activePlayers = room.slots.filter(s => s.name);

      document.getElementById('session-detail-content').innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;margin-bottom:18px;">
          <div>
            <span class="badge badge-18">CHI TIẾT CA DẪN #${room.id}</span>
            <h2 style="font-family:var(--font-display);font-size:1.5rem;margin-top:6px;">${scr.title}</h2>
            <p class="text-gold" style="font-size:0.9rem;">🚪 ${pRoom ? pRoom.name : 'Phòng Mật Thất 01 — Tầng 2'} • ⏰ ${room.date} (${room.timeSlot})</p>
          </div>
          <span class="badge badge-green">Đã có mặt: ${activePlayers.filter(p => p.checkedIn).length}/${activePlayers.length}</span>
        </div>

        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr><th>Người chơi</th><th>SĐT</th><th>Cọc 50k</th><th>Check-in tại quán</th></tr>
            </thead>
            <tbody>
              ${activePlayers.map(p => `
                <tr>
                  <td><strong>${p.name}</strong></td>
                  <td><a href="tel:${p.phone}" class="text-gold">${p.phone || '—'}</a></td>
                  <td><span class="badge ${p.paid ? 'badge-green' : 'badge-18'}">${p.paid ? 'Đã cọc' : 'Chưa cọc'}</span></td>
                  <td>
                    <button class="btn btn-sm ${p.checkedIn ? 'btn-gold' : 'btn-ghost'}" data-checkin="${p.seat}" style="min-width:128px;">
                      ${p.checkedIn ? '✓ Đã có mặt' : 'Vắng mặt (Chạm)'}
                    </button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;

      document.querySelectorAll('[data-checkin]').forEach(btn => {
        btn.addEventListener('click', () => {
          store.toggleCheckIn(room.id, Number(btn.dataset.checkin));
          renderSessionDetail();
        });
      });
    }

    document.querySelectorAll('[data-dmtab]').forEach(btn => {
      btn.addEventListener('click', () => {
        dmTab = btn.dataset.dmtab;
        document.querySelectorAll('[data-dmtab]').forEach(b => b.classList.toggle('active', b === btn));
        renderDmDashboard();
      });
    });

    renderDmDashboard();
    renderSessionDetail();
  </script>
</body>
</html>
