<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Bake Theatrical Poster</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@700;800;900&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 640px;
      height: 420px;
      overflow: hidden;
      background: #050608;
      font-family: 'Segoe UI', sans-serif;
    }
    
    .poster-frame {
      position: relative;
      width: 640px;
      height: 420px;
      overflow: hidden;
      background: #000;
    }
    .poster-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.68) contrast(1.2) saturate(0.9);
      transform: scale(1.05);
    }
    .poster-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 20%, rgba(5, 6, 8, 0.72) 65%, rgba(5, 6, 8, 0.98) 100%),
                  linear-gradient(to top, rgba(5, 6, 8, 0.98) 0%, rgba(5, 6, 8, 0.65) 45%, transparent 75%),
                  linear-gradient(to bottom, rgba(5, 6, 8, 0.8) 0%, transparent 35%);
    }
    .poster-borders {
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(139, 0, 0, 0.4);
      border-left: 4px solid #8B0000;
      pointer-events: none;
      z-index: 3;
    }
    .poster-content {
      position: absolute;
      inset: 0;
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 4;
    }
    .poster-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .poster-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #C4A36B;
      letter-spacing: 2px;
      background: rgba(10, 6, 8, 0.9);
      padding: 4px 10px;
      border: 1px solid rgba(196, 163, 107, 0.45);
      text-transform: uppercase;
    }
    .poster-genre {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      color: #FFF;
      background: #8B0000;
      padding: 4px 12px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      box-shadow: 0 0 12px rgba(230, 57, 70, 0.5);
    }
    .poster-bottom {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 60px;
    }
    .poster-subtitle {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 2.5px;
      color: #FF4D5E;
      text-transform: uppercase;
      font-weight: 700;
    }
    .poster-title {
      font-family: 'Cinzel Decorative', 'Cinzel', 'Cormorant Garamond', serif;
      font-size: 32px;
      font-weight: 900;
      line-height: 1.15;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      background: linear-gradient(180deg, #FFFFFF 0%, #F5E6D3 35%, #E63946 75%, #8B0000 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.95)) drop-shadow(0 0 16px rgba(230, 57, 70, 0.65));
    }
    .poster-desc {
      font-family: 'Cormorant Garamond', serif;
      font-size: 15px;
      font-style: italic;
      color: #D6CEC5;
      line-height: 1.35;
      max-width: 90%;
    }
    .wax-seal {
      position: absolute;
      right: 24px;
      bottom: 22px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #E63946, #8B0000 65%, #4A0000 100%);
      box-shadow: 0 6px 16px rgba(0,0,0,0.9), inset 0 2px 5px rgba(255,255,255,0.45);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1.5px dashed rgba(255,255,255,0.3);
      transform: rotate(-14deg);
      z-index: 5;
    }
    .wax-seal span {
      font-family: 'Cinzel Decorative', serif;
      font-size: 13px;
      font-weight: 900;
      color: #FFD2D6;
      line-height: 1;
    }
    .wax-seal small {
      font-size: 7px;
      color: #FFB3B8;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.8px;
    }
  </style>
</head>
<body>
  <div id="mount"></div>

  <script type="module">
    import { GAMES_CATALOG } from './src/api/demo/games-data.js';
    import { POSTER_METADATA } from './src/content/theatrical-metadata.js';

    const params = new URLSearchParams(window.location.search);
    const gameId = params.get('id') || 'game_001';

    const game = GAMES_CATALOG.find(g => g.id === gameId) || GAMES_CATALOG[0];
    const meta = POSTER_METADATA[game.id] || {
      subtitle: 'HỒ SƠ MẬT VỤ SALON',
      tagline: 'Mỗi chi tiết tại hiện trường đều là mắt xích của vụ án mạng.',
      badge: game.genre
    };

    const mount = document.getElementById('mount');
    mount.innerHTML = `
      <div class="poster-frame">
        <img class="poster-bg" src="./assets/images/covers/${game.id}.jpg" id="bg-img" />
        <div class="poster-overlay"></div>
        <div class="poster-borders"></div>
        <div class="poster-content">
          <div class="poster-top">
            <span class="poster-tag">JBS // CASE-${game.id.replace('game_', '')}</span>
            <span class="poster-genre">${meta.badge || game.genre}</span>
          </div>
          <div class="poster-bottom">
            <span class="poster-subtitle">${meta.subtitle}</span>
            <h1 class="poster-title">${game.title}</h1>
            <p class="poster-desc">"${meta.tagline}"</p>
          </div>
          <div class="wax-seal">
            <span>KS</span>
            <small>SALON</small>
          </div>
        </div>
      </div>
    `;

    window.__POSTER_READY__ = false;
    const img = document.getElementById('bg-img');
    const markReady = () => {
      document.fonts.ready.then(() => {
        window.__POSTER_READY__ = true;
      });
    };
    if (img.complete) {
      markReady();
    } else {
      img.onload = markReady;
      img.onerror = markReady;
    }
  </script>
</body>
</html>
