<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trang ADMIN — Cổng Quản Trị Hệ Thống Kịch Bản Sát V16</title>
  <link rel="stylesheet" href="./src/styles/variables.css" />
  <link rel="stylesheet" href="./src/styles/base.css" />
  <link rel="stylesheet" href="./src/styles/main.css" />
  <link rel="stylesheet" href="./src/styles/components.css" />
  <link rel="stylesheet" href="./src/styles/home.css" />
  <link rel="stylesheet" href="./src/styles/pages.css" />
  <link rel="stylesheet" href="./src/styles/portal-themes.css" />
</head>
<body class="is-admin-portal theme-admin">
  <div id="role-demo-bar" class="role-demo-bar"></div>
  <header id="app-site-header" class="site-header"></header>

  <main class="page-shell">
    <div id="admin-mount" class="container" style="padding: 24px 20px 60px;">
      <div style="text-align: center; padding: 60px 20px; color: var(--text-muted);">
        Đang khởi tạo Cổng Quản Trị (Admin Console)...
      </div>
    </div>
  </main>

  <footer id="app-footer"></footer>

  <script type="module">
    import { authState } from './src/api/auth-state.js';
    import { initSharedChrome } from './src/utils/shared-header.js';
    import { AuthModal } from './src/pages/auth/auth-modal.js';
    import { AdminView } from './src/pages/admin/admin-view.js';

    async function initAdminPortal() {
      try {
        await authState.checkSession();
      } catch {
        // guest
      }

      initSharedChrome('admin');

      const adminMount = document.getElementById('admin-mount');
      let adminView = null;

      const authModal = new AuthModal(() => {
        initSharedChrome('admin');
        adminView?.render();
      });
      authModal.render();

      document.getElementById('btn-open-login')?.addEventListener('click', () => {
        authModal.show(false, 'ADMIN');
      });

      adminView = new AdminView(adminMount, () => authModal.show(false, 'ADMIN'));
      await adminView.render();
    }

    initAdminPortal();
  </script>
</body>
</html>
