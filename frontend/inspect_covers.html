<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Kiểm Tra 42 Bìa Hồ Sơ Án Mạng</title>
  <style>
    body {
      background: #050608;
      color: #ECE7DE;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 24px;
    }
    h1 {
      color: #FF4D5E;
      text-align: center;
      margin-bottom: 24px;
      font-size: 24px;
      letter-spacing: 1px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 16px;
    }
    .card {
      background: #0E070A;
      border: 1px solid #361016;
      border-left: 3px solid #8B0000;
      padding: 8px;
      display: flex;
      flex-direction: column;
    }
    .card img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      background: #111;
    }
    .card-meta {
      padding: 6px 0 0;
    }
    .id-tag {
      font-size: 11px;
      color: #C4A36B;
      font-family: monospace;
    }
    .title {
      font-size: 13px;
      font-weight: bold;
      color: #FFF;
      margin: 2px 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .genre {
      font-size: 11px;
      color: #A89F93;
    }
  </style>
</head>
<body>
  <h1>BẢNG KIỂM TRA 42 BÌA HỒ SƠ ÁN MẠNG JUBENSHA</h1>
  <div class="grid" id="grid"></div>

  <script type="module">
    import { GAMES_CATALOG } from './src/api/demo/games-data.js';
    const grid = document.getElementById('grid');
    GAMES_CATALOG.forEach(g => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <img src="${g.cover_url}" alt="${g.title}" />
        <div class="card-meta">
          <div class="id-tag">${g.id}</div>
          <div class="title">${g.title}</div>
          <div class="genre">${g.genre}</div>
        </div>
      `;
      grid.appendChild(card);
    });
  </script>
</body>
</html>
