<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Kịch Bản Sát V16 — Nền Tảng Đặt Lịch Chơi Jubensha Trực Tuyến</title>
  
  <!-- Typography Fonts (Google Fonts with Full Vietnamese Support) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Core Design System Stylesheets -->
  <link rel="stylesheet" href="./src/styles/reset.css">
  <link rel="stylesheet" href="./src/styles/variables.css">
  <link rel="stylesheet" href="./src/styles/main.css">

  <!-- 3D & Motion Engine Suites (Three.js, GSAP & Vanilla-Tilt) -->
  <script src="./src/vendor/three.min.js"></script>
  <script src="./src/vendor/gsap.min.js"></script>
  <script src="./src/vendor/ScrollTrigger.min.js"></script>
  <script src="./src/vendor/vanilla-tilt.min.js"></script>
</head>
<body>
  <!-- 0KB SVG Film Grain Texture (Cinematic 35mm Noir Grain) -->
  <svg style="position: absolute; width: 0; height: 0; pointer-events: none;" aria-hidden="true">
    <filter id="noir-film-grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.9   0 0 0 0 0.9   0 0 0 0 0.9   0 0 0 0.038 0" />
    </filter>
  </svg>
  <div class="noir-grain-overlay" aria-hidden="true"></div>

  <!-- Top Navigation & Demo Control Banner -->
  <div id="nav-mount"></div>

  <!-- Main Dynamic Application Viewport -->
  <main id="app-mount">
    <div style="padding: 6rem 1rem; text-align: center; color: var(--color-text-secondary); display: flex; flex-direction: column; align-items: center; gap: 1rem;">
      <div style="width: 44px; height: 44px; border: 2px solid var(--color-accent-gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 700; color: var(--color-accent-gold); font-size: 1.1rem; box-shadow: 0 0 16px rgba(196,163,107,0.2);">KS</div>
      <p style="font-family: var(--font-mono); font-size: 0.85rem; letter-spacing: 1px; color: var(--color-text-gold);">KHỞI TẠO MẬT VỤ SALON // JUBENSHA V16</p>
    </div>
  </main>

  <!-- Mobile Bottom Tab Bar (Player & DM) -->
  <div id="bottom-nav-mount"></div>

  <!-- Entry Point Script -->
  <script type="module" src="./src/app.js"></script>
</body>
</html>
