<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chi Tiết Phòng Chơi — Kịch Bản Sát V16</title>
  <link rel="stylesheet" href="../src/styles/components.css" />
  <link rel="stylesheet" href="../src/styles/portals-vintage.css" />
</head>
<body>
  <div id="app-header"></div>

  <main class="portal-main">
    <div class="container" id="room-detail-root">Đang tải thông tin phòng...</div>
  </main>

  <div id="app-footer"></div>

  <script type="module">
    import { initChrome } from '../src/logic/layout.js';
    import { store } from '../src/logic/store.js';
    import { api, syncSessionUser } from '../src/logic/api.js';
    import { requireAuthRole, escapeHtml, showToast, formatRoomStatus, formatParticipantStatus } from '../src/logic/portal-mock.js';

    const params = new URLSearchParams(window.location.search);
    const roomId = params.get('id') || '1';
    let sessionInfo = { user: null, role: 'guest' };

    function ensureLogin() {
      if (sessionInfo.role === 'guest') {
        showToast('Vui lòng đăng nhập để thực hiện thao tác này.');
        window.setTimeout(() => { window.location.href = './auth.html#login'; }, 600);
        return false;
      }
      return true;
    }

    async function render() {
      const root = document.getElementById('room-detail-root');
      try {
        const data = await api.get(`/rooms/${encodeURIComponent(roomId)}`);
        const room = data?.room || data;
        const participants = data?.participants || room?.participants || [];
        const proposals = data?.proposals || room?.proposals || [];
        const game = room?.game || {};
        const myId = Number(sessionInfo.user?.id || 0);
        const myPart = participants.find((p) => Number(p.user_id) === myId && !['LEFT', 'CANCELLED', 'CANCELLED_UNPAID', 'CANCELLED_BY_ADMIN'].includes(String(p.status)));
        const activeParts = participants.filter((p) => !['LEFT', 'CANCELLED', 'CANCELLED_UNPAID', 'CANCELLED_BY_ADMIN'].includes(String(p.status)));
        const isPlayer = sessionInfo?.role === 'player';
        const mySeatCount = Number(myPart?.seats || 1);
        const myDepAmt = mySeatCount * 50000;
        const occupiedSeats = Number(room.current_players ?? activeParts.length);
        const maxSeats = Number(room.max_players || 6);
        const emptySeats = Math.max(0, maxSeats - occupiedSeats);
        const joinSeatOptions = [];
        for (let n = 1; n <= emptySeats; n++) {
          joinSeatOptions.push(`<option value="${n}">${n} người (Cọc ${(n * 50000).toLocaleString('vi-VN')} đ)</option>`);
        }

        root.innerHTML = `
          <div class="portal-hero">
            <div>
              <div class="portal-eyebrow">PHÒNG #${room.id} • ${escapeHtml(formatRoomStatus(room.status))}</div>
              <h1 class="portal-title">${escapeHtml(room.title || game.name || 'Chi tiết phòng chơi')}</h1>
              <p class="portal-subtitle">Kịch bản: ${escapeHtml(game.name || 'Kịch bản')} • Thời lượng: ${game.duration_minutes || 210} phút • Sĩ số: ${occupiedSeats}/${maxSeats}</p>
            </div>
            <div class="portal-actions">
              ${sessionInfo?.role === 'dm'
                ? `<a href="./dm-portal.html" class="btn btn-gold">Quay lại Cổng Quản Trò</a>`
                : sessionInfo?.role === 'admin'
                  ? `<a href="./admin-portal.html" class="btn btn-gold">Quay lại Trang Quản Trị</a>`
                  : `<a href="./lobby.html" class="btn btn-ghost">Quay lại Sảnh</a>`}
              ${isPlayer && myPart ? `<a href="./booking-status.html?id=${encodeURIComponent(room.id)}" class="btn btn-gold">Xem Vé &amp; Thanh Toán</a>` : ''}
              ${!isPlayer ? `<a href="./booking-status.html?id=${encodeURIComponent(room.id)}" class="btn btn-ghost">Đối Soát Thanh Toán Phòng</a>` : ''}
            </div>
          </div>

          <div class="portal-two-col">
            <div>
              <section class="portal-panel">
                <h2 class="portal-panel-title">Danh Sách Thành Viên (${occupiedSeats} / ${maxSeats} chỗ)</h2>
                <div class="portal-table-wrap">
                  <table class="portal-table">
                    <thead><tr><th>#</th><th>Thành viên</th><th>Trạng thái</th><th>Cọc</th></tr></thead>
                    <tbody>
                      ${activeParts.map((p, i) => {
                        const pIsCreator = Number(p.user_id) === Number(room.creator_id || 0);
                        const pSeats = Number(p.seats || 1);
                        return `
                        <tr>
                          <td>${i + 1}</td>
                          <td>
                            <strong>${escapeHtml(p.full_name || p.name || ('Thành viên #' + p.user_id))}</strong>
                            ${pIsCreator ? ` <span class="v-badge v-badge-muted" style="font-size:0.66rem;padding:2px 6px;">Chủ phòng</span>` : ''}
                            ${pSeats > 1 ? ` <span class="text-muted" style="font-size:0.8rem;">(Đại diện ${pSeats} người)</span>` : ''}
                          </td>
                          <td><span class="v-badge ${p.status === 'DEPOSITED' ? 'v-badge-green' : 'v-badge-gold'}">${escapeHtml(formatParticipantStatus(p.status))}</span></td>
                          <td>${p.status === 'DEPOSITED' ? `Đã cọc ${(pSeats * 50000).toLocaleString('vi-VN')} đ` : 'Chờ cọc'}</td>
                        </tr>
                      `; }).join('')}
                    </tbody>
                  </table>
                </div>
                ${isPlayer ? `
                  <div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
                    ${!myPart && room.status === 'FORMING' && emptySeats > 0 ? `
                      <select id="rd-join-seats" class="portal-select" style="min-width:190px;">${joinSeatOptions.join('')}</select>
                      <button class="btn btn-gold btn-sm" id="btn-join-room">Tham gia phòng này</button>
                    ` : ''}
                    ${myPart && myPart.status !== 'DEPOSITED' && room.status !== 'CANCELLED' && room.status !== 'COMPLETED' ? `<button class="btn btn-gold btn-sm" id="btn-deposit-now">Thanh toán cọc giữ chỗ (${myDepAmt.toLocaleString('vi-VN')} đ)</button>` : ''}
                    ${myPart ? `<button class="btn btn-ghost btn-sm" id="btn-leave-room">Hủy / Rời phòng</button>` : ''}
                  </div>
                ` : `
                  <p class="text-muted" style="margin-top:14px;font-size:0.84rem;">Chế độ điều phối dành cho ${sessionInfo?.role === 'admin' ? 'Quản trị viên' : 'Quản trò'} — không phát sinh thao tác tham gia hoặc đặt cọc cá nhân.</p>
                `}
              </section>

              <section class="portal-panel">
                <h2 class="portal-panel-title">Khung Giờ Đã Đăng Ký</h2>
                ${(() => {
                  const chosenStart = room.session?.start_at || room.target_time_slot || proposals[0]?.proposed_start_at || '';
                  const chosenEnd = room.session?.end_at || proposals[0]?.proposed_end_at || '';
                  const scheduleNote = room.status === 'CONFIRMED'
                    ? 'Quản trò đã xác nhận nhận ca cho khung giờ này.'
                    : room.status === 'SCHEDULED'
                      ? 'Đã xếp lịch và gán Quản trò, đang chờ Quản trò xác nhận nhận ca.'
                      : room.status === 'IN_PROGRESS'
                        ? 'Buổi chơi đang diễn ra.'
                        : room.status === 'COMPLETED'
                          ? 'Buổi chơi đã hoàn tất.'
                          : room.status === 'CANCELLED'
                            ? 'Phòng chơi đã bị hủy.'
                            : 'Đang tuyển đủ thành viên theo khung giờ chủ phòng đã đăng ký.';
                  return chosenStart
                    ? `
                      <div class="summary-row"><span>Thời gian bắt đầu</span><strong>${escapeHtml(chosenStart)}</strong></div>
                      ${chosenEnd ? `<div class="summary-row"><span>Dự kiến kết thúc</span><strong>${escapeHtml(chosenEnd)}</strong></div>` : ''}
                      <p class="text-muted" style="margin-top:10px;font-size:0.86rem;">${escapeHtml(scheduleNote)}</p>
                    `
                    : '<p class="text-muted">Chủ phòng chưa ấn định khung giờ cụ thể.</p>';
                })()}
              </section>

              ${isPlayer && myPart && room.status === 'COMPLETED' && room.session?.id ? `
                <section class="portal-panel">
                  <h2 class="portal-panel-title">Đánh Giá Sau Buổi Chơi</h2>
                  <form id="review-form" style="display:flex;flex-direction:column;gap:10px;">
                    <select id="review-rating" class="portal-select">
                      <option value="5">5 sao — Xuất sắc</option>
                      <option value="4">4 sao — Rất tốt</option>
                      <option value="3">3 sao — Khá ổn</option>
                      <option value="2">2 sao — Cần cải thiện</option>
                      <option value="1">1 sao — Chưa hài lòng</option>
                    </select>
                    <textarea id="review-comment" class="portal-input" rows="2" placeholder="Chia sẻ cảm nhận của bạn về kịch bản và Quản trò..."></textarea>
                    <button type="submit" class="btn btn-gold btn-sm" style="align-self:flex-start;">Gửi đánh giá</button>
                  </form>
                </section>
              ` : ''}
            </div>

            <aside>
              <section class="portal-panel">
                <h2 class="portal-panel-title">Thông Tin Phòng &amp; Ca Chơi</h2>
                <div class="summary-row"><span>Mã phòng</span><strong>#${room.id}</strong></div>
                <div class="summary-row"><span>Trạng thái</span><strong>${escapeHtml(formatRoomStatus(room.status))}</strong></div>
                <div class="summary-row"><span>Chi nhánh</span><strong>${room.session?.venue_name || room.venue?.name || room.target_venue_name || 'Chưa gán'}</strong></div>
                ${room.session?.physical_room_name ? `<div class="summary-row"><span>Phòng vật lý</span><strong>${room.session.physical_room_name}</strong></div>` : ''}
                ${room.session?.dm_name ? `<div class="summary-row"><span>Quản trò</span><strong>${room.session.dm_name}</strong></div>` : ''}
                ${room.session?.start_at ? `<div class="summary-row"><span>Giờ bắt đầu</span><strong>${room.session.start_at}</strong></div>` : ''}
                <div class="summary-row"><span>Số người tối thiểu</span><strong>${room.min_players || game.min_players || 4} người</strong></div>
                <p class="text-muted" style="margin-top:12px;font-size:0.86rem;">${escapeHtml(room.description || 'Không có mô tả thêm.')}</p>
              </section>
            </aside>
          </div>
        `;

        document.getElementById('btn-join-room')?.addEventListener('click', async () => {
          if (!ensureLogin()) return;
          const seats = Math.max(1, Number(document.getElementById('rd-join-seats')?.value || 1));
          try {
            await api.post(`/rooms/${room.id}/join`, { seats });
            showToast(`Tham gia phòng (${seats} người) thành công.`);
            render();
          } catch (e) { showToast(e.message); }
        });

        document.getElementById('btn-deposit-now')?.addEventListener('click', async () => {
          if (!ensureLogin()) return;
          try {
            await api.post('/payments/deposit', { room_id: Number(room.id), is_lump_sum: mySeatCount > 1, amount: myDepAmt, provider: 'VNPAY' });
            showToast(`Thanh toán cọc giữ ${mySeatCount} chỗ (${myDepAmt.toLocaleString('vi-VN')} đ) thành công.`);
            render();
          } catch (e) { showToast(e.message); }
        });

        document.getElementById('btn-leave-room')?.addEventListener('click', async () => {
          if (!ensureLogin()) return;
          try { await api.post(`/rooms/${room.id}/leave`, { reason: 'Người chơi chủ động rời phòng' }); showToast('Đã rời phòng.'); render(); } catch (e) { showToast(e.message); }
        });

        document.getElementById('review-form')?.addEventListener('submit', async (e) => {
          e.preventDefault();
          if (!ensureLogin()) return;
          try {
            await api.post(`/sessions/${room.session.id}/reviews`, {
              rating: Number(document.getElementById('review-rating').value),
              comment: document.getElementById('review-comment').value.trim(),
            });
            showToast('Cảm ơn bạn đã gửi đánh giá buổi chơi.');
          } catch (err) { showToast(err.message); }
        });
      } catch (err) {
        root.innerHTML = `<div class="portal-panel">Không tìm thấy phòng chơi #${roomId}: ${err.message}</div>`;
      }
    }

    (async () => {
      const auth = await requireAuthRole(['player', 'dm', 'admin'], 'Chi Tiết Phòng Chơi');
      sessionInfo = auth;
      initChrome('lobby');
      if (!auth.allowed) return;
      render();
    })();
  </script>
</body>
</html>
