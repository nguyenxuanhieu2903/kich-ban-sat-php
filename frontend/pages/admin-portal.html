<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cổng Quản Trị Viên (Admin Portal) — Kịch Bản Sát V16</title>
  <link rel="stylesheet" href="../src/styles/components.css" />
  <link rel="stylesheet" href="../src/styles/portals-vintage.css" />
</head>
<body>
  <div id="app-header"></div>

  <main class="portal-main">
    <div class="container">
      <div class="portal-hero">
        <div>
          <div class="portal-eyebrow">ADMIN PORTAL — CENTRAL OPERATIONS &amp; FINANCE</div>
          <h1 class="portal-title">Cổng Quản Trị Hệ Thống</h1>
          <p class="portal-subtitle">Điều phối Quản trò &amp; Phòng vật lý, phê duyệt hoàn tiền, xét duyệt HSSV và kiểm toán trực tiếp trên MySQL.</p>
        </div>
        <div class="portal-actions">
          <a href="./dm-portal.html" class="btn btn-ghost">Mở DM Portal</a>
        </div>
      </div>

      <div class="kpi-grid" id="admin-kpi"></div>

      <div class="portal-tabs" id="admin-tabs">
        <button class="portal-tab active" data-tab="rooms">Điều phối Phòng &amp; DM</button>
        <button class="portal-tab" data-tab="games">Kịch bản &amp; Bảng giá</button>
        <button class="portal-tab" data-tab="promos">Khuyến mãi &amp; Chi nhánh</button>
        <button class="portal-tab" data-tab="refunds">Duyệt Hoàn tiền</button>
        <button class="portal-tab" data-tab="payments">Giao dịch Thanh toán</button>
        <button class="portal-tab" data-tab="hssv">Người dùng &amp; Thẻ HSSV</button>
        <button class="portal-tab" data-tab="audit">Nhật ký Kiểm toán</button>
      </div>

      <section class="portal-panel" id="admin-panel">Đang tải dữ liệu quản trị...</section>
    </div>
  </main>

  <div id="app-footer"></div>

  <script type="module">
    import { initChrome } from '../src/logic/layout.js';
    import { api } from '../src/logic/api.js';
    import { requireAuthRole, formatVND, escapeHtml, showToast } from '../src/logic/portal-mock.js';

    let activeTab = 'rooms';
    let currentAdminId = 0;

    async function render() {
      const panel = document.getElementById('admin-panel');
      try {
        const [revData, roomsData, refundsData, usersData, prData] = await Promise.all([
          api.get('/admin/reports/revenue').catch(() => ({})),
          api.get('/rooms?status=ALL&per_page=20').catch(() => ({ rooms: [] })),
          api.get('/admin/refunds').catch(() => ({ refunds: [] })),
          api.get('/admin/users?per_page=100').catch(() => ({ users: [] })),
          api.get('/admin/physical-rooms').catch(() => ({ physical_rooms: [] })),
        ]);

        const rooms = Array.isArray(roomsData) ? roomsData : (roomsData?.rooms || roomsData?.items || []);
        const refunds = Array.isArray(refundsData) ? refundsData : (refundsData?.refunds || refundsData?.items || []);
        const users = Array.isArray(usersData) ? usersData : (usersData?.users || usersData?.items || []);
        const physicalRooms = Array.isArray(prData) ? prData : (prData?.physical_rooms || prData?.items || []);
        const dms = users.filter((u) => String(u.role_code || u.role || '').toUpperCase() === 'DM');

        const netRev = Number(
          revData?.total_net_revenue
          ?? revData?.revenue?.net_revenue
          ?? revData?.net_revenue
          ?? revData?.total_revenue
          ?? revData?.summary?.net_revenue
          ?? 0
        );
        const pendingRefunds = refunds.filter((r) => r.status === 'PENDING').length;

        document.getElementById('admin-kpi').innerHTML = `
          <div class="kpi-card"><div class="kpi-label">Doanh thu thuần</div><div class="kpi-value">${formatVND(netRev)}</div><div class="kpi-meta">Báo cáo trực tiếp từ MySQL</div></div>
          <div class="kpi-card"><div class="kpi-label">Phòng chơi (tải gần nhất)</div><div class="kpi-value">${roomsData?.meta?.total ?? rooms.length}</div><div class="kpi-meta">${physicalRooms.length} phòng vật lý</div></div>
          <div class="kpi-card"><div class="kpi-label">Hoàn tiền chờ duyệt</div><div class="kpi-value">${pendingRefunds}</div><div class="kpi-meta">Tổng ${refunds.length} yêu cầu</div></div>
          <div class="kpi-card"><div class="kpi-label">Người dùng hệ thống</div><div class="kpi-value">${users.length}</div><div class="kpi-meta">${dms.length} Quản trò (DM)</div></div>
        `;

        if (activeTab === 'rooms') {
          panel.innerHTML = `
            <h2 class="portal-panel-title">Điều Phối Phòng Chơi, Quản Trò (DM) &amp; Phòng Vật Lý</h2>
            <div class="portal-table-wrap">
              <table class="portal-table">
                <thead><tr><th>Phòng</th><th>Kịch bản</th><th>Trạng thái</th><th>Gán DM</th><th>Gán Phòng vật lý</th><th>Thao tác</th></tr></thead>
                <tbody>
                  ${rooms.slice(0, 15).map((r) => {
                    const isClosedRoom = r.status === 'CANCELLED' || r.status === 'COMPLETED';
                    return `
                    <tr>
                      <td><strong>#${r.id}</strong></td>
                      <td>${escapeHtml(r.game_name || r.title || '')}</td>
                      <td><span class="v-badge ${r.status === 'COMPLETED' ? 'v-badge-green' : r.status === 'CANCELLED' ? 'v-badge-crimson' : 'v-badge-gold'}">${escapeHtml(r.status)}</span></td>
                      <td>
                        ${isClosedRoom ? '<span class="text-muted" style="font-size:0.82rem;">Không áp dụng</span>' : `
                          <select class="portal-select" data-dm-sel="${r.id}">
                            <option value="">-- Chọn DM --</option>
                            ${dms.map((d) => `<option value="${d.id}">${d.full_name || d.email}</option>`).join('')}
                          </select>
                        `}
                      </td>
                      <td>
                        ${isClosedRoom ? '<span class="text-muted" style="font-size:0.82rem;">Không áp dụng</span>' : `
                          <select class="portal-select" data-pr-sel="${r.id}">
                            <option value="">-- Chọn phòng vật lý --</option>
                            ${physicalRooms.map((p) => `<option value="${p.id}">${p.name || ('PR #' + p.id)}${p.is_maintenance ? ' (Bảo trì)' : ''}</option>`).join('')}
                          </select>
                        `}
                      </td>
                      <td style="display:flex;gap:6px;flex-wrap:wrap;">
                        ${!isClosedRoom ? `
                          <button class="btn btn-gold btn-sm" data-assign-dm="${r.id}">Gán DM</button>
                          <button class="btn btn-ghost btn-sm" data-assign-pr="${r.id}">Gán Phòng</button>
                          <button class="btn btn-ghost btn-sm" data-disband="${r.id}">Giải tán</button>
                        ` : `<a href="./room-detail.html?id=${encodeURIComponent(r.id)}" class="btn btn-ghost btn-sm">Xem hồ sơ</a>`}
                      </td>
                    </tr>
                  `; }).join('')}
                </tbody>
              </table>
            </div>

            <h3 class="portal-panel-title" style="margin-top:24px;">Quản Lý Phòng Vật Lý: Khóa Hotline/Walk-in &amp; Bảo Trì</h3>
            <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;">
              <select class="portal-select" id="ob-pr-id" style="max-width:220px;">
                ${physicalRooms.map((p) => `<option value="${p.id}">${p.name || ('PR #' + p.id)}${p.is_maintenance ? ' (Đang bảo trì)' : ''}</option>`).join('')}
              </select>
              <input type="datetime-local" id="ob-start" class="portal-input" value="2026-12-15T14:00" style="max-width:200px;" />
              <input type="datetime-local" id="ob-end" class="portal-input" value="2026-12-15T17:00" style="max-width:200px;" />
              <input type="text" id="ob-reason" class="portal-input" placeholder="Lý do (VD: Khách đặt Hotline)" style="max-width:220px;" />
              <button class="btn btn-gold btn-sm" id="btn-offline-block">Khóa phòng Hotline</button>
              <button class="btn btn-ghost btn-sm" id="btn-toggle-maint">Bật/Tắt Bảo trì</button>
            </div>
          `;

          panel.querySelectorAll('[data-assign-dm]').forEach((btn) => btn.addEventListener('click', async () => {
            const rid = btn.getAttribute('data-assign-dm');
            const dmId = Number(panel.querySelector(`[data-dm-sel="${rid}"]`).value);
            if (!dmId) { showToast('Vui lòng chọn Quản trò trước.'); return; }
            try { await api.post(`/admin/rooms/${rid}/assign-dm`, { dm_user_id: dmId }); showToast(`Đã phân công DM cho phòng #${rid}.`); render(); } catch (e) { showToast(e.message); }
          }));

          panel.querySelectorAll('[data-assign-pr]').forEach((btn) => btn.addEventListener('click', async () => {
            const rid = btn.getAttribute('data-assign-pr');
            const prId = Number(panel.querySelector(`[data-pr-sel="${rid}"]`).value);
            if (!prId) { showToast('Vui lòng chọn phòng vật lý trước.'); return; }
            try { await api.post(`/admin/rooms/${rid}/assign-venue`, { physical_room_id: prId }); showToast(`Đã gán phòng vật lý cho phòng #${rid}.`); render(); } catch (e) { showToast(e.message); }
          }));

          panel.querySelectorAll('[data-disband]').forEach((btn) => btn.addEventListener('click', async () => {
            const rid = btn.getAttribute('data-disband');
            const reason = window.prompt(`Nhập lý do giải tán phòng #${rid}:`, 'Điều phối lại lịch vận hành');
            if (!reason) return;
            try { await api.post(`/admin/rooms/${rid}/disband`, { reason }); showToast(`Đã giải tán phòng #${rid}.`); render(); } catch (e) { showToast(e.message); }
          }));

          document.getElementById('btn-offline-block')?.addEventListener('click', async () => {
            const prId = Number(document.getElementById('ob-pr-id')?.value);
            const startAt = (document.getElementById('ob-start')?.value || '').replace('T', ' ') + ':00';
            const endAt = (document.getElementById('ob-end')?.value || '').replace('T', ' ') + ':00';
            const reason = (document.getElementById('ob-reason')?.value || '').trim() || 'Khóa giữ chỗ khách Hotline/Walk-in';
            try { await api.post('/admin/rooms/offline-block', { physical_room_id: prId, start_at: startAt, end_at: endAt, reason }); showToast('Đã khóa phòng cho khách Hotline/Walk-in.'); render(); } catch (e) { showToast(e.message); }
          });

          document.getElementById('btn-toggle-maint')?.addEventListener('click', async () => {
            const prId = Number(document.getElementById('ob-pr-id')?.value);
            const pr = physicalRooms.find((p) => Number(p.id) === prId);
            const nextState = !Boolean(pr?.is_maintenance);
            try { await api.patch(`/admin/physical-rooms/${prId}/maintenance`, { is_maintenance: nextState, reason: nextState ? 'Bảo trì đạo cụ phòng' : 'Hoàn tất bảo trì' }); showToast(`Đã ${nextState ? 'bật' : 'tắt'} bảo trì phòng #${prId}.`); render(); } catch (e) { showToast(e.message); }
          });
        } else if (activeTab === 'games') {
          const gData = await api.get('/admin/games').catch(() => ({ games: [] }));
          const games = gData?.games || (Array.isArray(gData) ? gData : []);
          panel.innerHTML = `
            <h2 class="portal-panel-title">Quản Lý Danh Mục Kịch Bản &amp; Bảng Giá (${games.length} bộ)</h2>
            <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;">
              <input id="ng-name" class="portal-input" placeholder="Tên kịch bản mới..." style="max-width:220px;" />
              <input id="ng-genre" class="portal-input" placeholder="Thể loại" value="Trinh thám" style="max-width:140px;" />
              <input id="ng-min" type="number" class="portal-input" value="5" style="max-width:70px;" title="Số người tối thiểu" />
              <input id="ng-max" type="number" class="portal-input" value="8" style="max-width:70px;" title="Số người tối đa" />
              <input id="ng-day" type="number" class="portal-input" value="199000" style="max-width:110px;" title="Giá ban ngày" />
              <input id="ng-night" type="number" class="portal-input" value="239000" style="max-width:110px;" title="Giá ban tối" />
              <button class="btn btn-gold btn-sm" id="btn-add-game">+ Thêm kịch bản</button>
            </div>
            <div class="portal-table-wrap">
              <table class="portal-table">
                <thead><tr><th>ID</th><th>Tên kịch bản</th><th>Sĩ số</th><th>Giá ngày</th><th>Giá tối</th><th>Trạng thái</th><th>Thao tác</th></tr></thead>
                <tbody>
                  ${games.map((g) => `
                    <tr>
                      <td><strong>#${g.id}</strong></td>
                      <td><strong>${g.name}</strong><div class="text-muted" style="font-size:0.78rem;">${g.genre || ''}</div></td>
                      <td>${g.min_players}–${g.max_players}</td>
                      <td><input type="number" class="portal-input" data-gday="${g.id}" value="${g.day_price || 199000}" style="width:105px;" /></td>
                      <td><input type="number" class="portal-input" data-gnight="${g.id}" value="${g.night_price || 239000}" style="width:105px;" /></td>
                      <td><span class="v-badge ${g.status === 'ACTIVE' ? 'v-badge-green' : 'v-badge-crimson'}">${g.status}</span></td>
                      <td style="display:flex;gap:6px;">
                        <button class="btn btn-gold btn-sm" data-save-game="${g.id}">Lưu giá</button>
                        <button class="btn btn-ghost btn-sm" data-toggle-game="${g.id}" data-next-gst="${g.status === 'ACTIVE' ? 'INACTIVE' : 'ACTIVE'}">${g.status === 'ACTIVE' ? 'Ẩn' : 'Hiện'}</button>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          `;
          document.getElementById('btn-add-game')?.addEventListener('click', async () => {
            const name = document.getElementById('ng-name').value.trim();
            if (!name) { showToast('Vui lòng nhập tên kịch bản.'); return; }
            try {
              await api.post('/admin/games', {
                name,
                genre: document.getElementById('ng-genre').value.trim(),
                min_players: Number(document.getElementById('ng-min').value),
                max_players: Number(document.getElementById('ng-max').value),
                day_price: Number(document.getElementById('ng-day').value),
                night_price: Number(document.getElementById('ng-night').value),
              });
              showToast('Đã thêm kịch bản mới.');
              render();
            } catch (e) { showToast(e.message); }
          });
          panel.querySelectorAll('[data-save-game]').forEach((b) => b.addEventListener('click', async () => {
            const gid = b.getAttribute('data-save-game');
            const day_price = Number(panel.querySelector(`[data-gday="${gid}"]`).value);
            const night_price = Number(panel.querySelector(`[data-gnight="${gid}"]`).value);
            try { await api.patch(`/admin/games/${gid}`, { day_price, night_price }); showToast(`Đã cập nhật bảng giá kịch bản #${gid}.`); render(); } catch (e) { showToast(e.message); }
          }));
          panel.querySelectorAll('[data-toggle-game]').forEach((b) => b.addEventListener('click', async () => {
            const gid = b.getAttribute('data-toggle-game');
            const status = b.getAttribute('data-next-gst');
            try { await api.patch(`/admin/games/${gid}`, { status }); showToast(`Đã chuyển kịch bản #${gid} sang ${status}.`); render(); } catch (e) { showToast(e.message); }
          }));
        } else if (activeTab === 'promos') {
          const [pData, vData] = await Promise.all([
            api.get('/admin/promotions').catch(() => ({ promotions: [] })),
            api.get('/venues').catch(() => ({ venues: [] })),
          ]);
          const promos = pData?.promotions || (Array.isArray(pData) ? pData : []);
          const venues = vData?.venues || (Array.isArray(vData) ? vData : []);
          panel.innerHTML = `
            <h2 class="portal-panel-title">Chương Trình Khuyến Mãi</h2>
            <div class="portal-table-wrap" style="margin-bottom:24px;">
              <table class="portal-table">
                <thead><tr><th>ID</th><th>Tên chương trình</th><th>Loại</th><th>Giá trị</th><th>Trạng thái</th><th>Thao tác</th></tr></thead>
                <tbody>
                  ${promos.length ? promos.map((pr) => `
                    <tr>
                      <td><strong>#${pr.id}</strong></td>
                      <td>${pr.name || pr.code || ''}</td>
                      <td>${pr.discount_type || ''}</td>
                      <td><strong>${pr.discount_value || 0}</strong></td>
                      <td><span class="v-badge ${pr.is_active ? 'v-badge-green' : 'v-badge-crimson'}">${pr.is_active ? 'ĐANG CHẠY' : 'TẠM TẮT'}</span></td>
                      <td><button class="btn btn-gold btn-sm" data-promo-toggle="${pr.id}" data-promo-next="${pr.is_active ? 0 : 1}">${pr.is_active ? 'Tắt' : 'Bật'}</button></td>
                    </tr>
                  `).join('') : '<tr><td colspan="6" class="text-muted">Chưa có chương trình khuyến mãi.</td></tr>'}
                </tbody>
              </table>
            </div>

            <h2 class="portal-panel-title">Quản Lý Chi Nhánh &amp; Thêm Phòng Vật Lý</h2>
            <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;">
              <input id="nv-name" class="portal-input" placeholder="Tên chi nhánh mới..." style="max-width:200px;" />
              <input id="nv-addr" class="portal-input" placeholder="Địa chỉ chi nhánh..." style="max-width:260px;" />
              <button class="btn btn-gold btn-sm" id="btn-add-venue">+ Thêm chi nhánh</button>
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;">
              <select id="npr-vid" class="portal-select" style="max-width:220px;">
                ${venues.map((v) => `<option value="${v.id}">${v.name}</option>`).join('')}
              </select>
              <input id="npr-name" class="portal-input" placeholder="Tên phòng vật lý mới..." style="max-width:200px;" />
              <input id="npr-cap" type="number" class="portal-input" value="8" style="max-width:80px;" title="Sức chứa" />
              <button class="btn btn-ghost btn-sm" id="btn-add-pr">+ Thêm phòng vật lý</button>
            </div>
          `;
          panel.querySelectorAll('[data-promo-toggle]').forEach((b) => b.addEventListener('click', async () => {
            const pid = b.getAttribute('data-promo-toggle');
            const is_active = Number(b.getAttribute('data-promo-next')) === 1;
            try { await api.patch(`/admin/promotions/${pid}`, { is_active }); showToast('Đã cập nhật trạng thái khuyến mãi.'); render(); } catch (e) { showToast(e.message); }
          }));
          document.getElementById('btn-add-venue')?.addEventListener('click', async () => {
            const name = document.getElementById('nv-name').value.trim();
            const address = document.getElementById('nv-addr').value.trim();
            if (!name || !address) { showToast('Vui lòng nhập tên và địa chỉ chi nhánh.'); return; }
            try { await api.post('/admin/venues', { name, address }); showToast('Đã thêm chi nhánh mới.'); render(); } catch (e) { showToast(e.message); }
          });
          document.getElementById('btn-add-pr')?.addEventListener('click', async () => {
            const vid = Number(document.getElementById('npr-vid').value);
            const name = document.getElementById('npr-name').value.trim();
            const capacity = Number(document.getElementById('npr-cap').value) || 8;
            if (!name) { showToast('Vui lòng nhập tên phòng vật lý.'); return; }
            try { await api.post(`/admin/venues/${vid}/rooms`, { name, capacity }); showToast('Đã thêm phòng vật lý mới.'); render(); } catch (e) { showToast(e.message); }
          });
        } else if (activeTab === 'refunds') {
          panel.innerHTML = `
            <h2 class="portal-panel-title">Quản Lý Yêu Cầu Hoàn Tiền Cọc</h2>
            <div class="portal-table-wrap">
              <table class="portal-table">
                <thead><tr><th>Mã</th><th>Người chơi</th><th>Số tiền</th><th>Lý do</th><th>Trạng thái</th><th>Thao tác</th></tr></thead>
                <tbody>
                  ${refunds.length ? refunds.map((rf) => `
                    <tr>
                      <td><strong>#${rf.id}</strong></td>
                      <td>${rf.user_name || rf.full_name || ('Payment #' + rf.player_payment_id)}</td>
                      <td><strong>${formatVND(rf.amount)}</strong></td>
                      <td>${rf.reason || ''}</td>
                      <td><span class="v-badge ${rf.status === 'COMPLETED' ? 'v-badge-green' : rf.status === 'APPROVED' ? 'v-badge-gold' : 'v-badge-crimson'}">${rf.status}</span></td>
                      <td style="display:flex;gap:6px;">
                        ${rf.status === 'PENDING' ? `
                          <button class="btn btn-gold btn-sm" data-rf-app="${rf.id}">Duyệt</button>
                          <button class="btn btn-ghost btn-sm" data-rf-rej="${rf.id}">Từ chối</button>
                        ` : ''}
                        ${rf.status === 'APPROVED' ? `<button class="btn btn-gold btn-sm" data-rf-comp="${rf.id}">Hoàn tất CK</button>` : ''}
                      </td>
                    </tr>
                  `).join('') : '<tr><td colspan="6" class="text-muted">Chưa có yêu cầu hoàn tiền nào.</td></tr>'}
                </tbody>
              </table>
            </div>
          `;
          panel.querySelectorAll('[data-rf-app]').forEach((b) => b.addEventListener('click', async () => {
            try { await api.post(`/admin/refunds/${b.getAttribute('data-rf-app')}/approve`, {}); showToast('Đã duyệt hoàn tiền.'); render(); } catch (e) { showToast(e.message); }
          }));
          panel.querySelectorAll('[data-rf-rej]').forEach((b) => b.addEventListener('click', async () => {
            try { await api.post(`/admin/refunds/${b.getAttribute('data-rf-rej')}/reject`, { reason: 'Không đủ điều kiện hoàn cọc theo quy chế 24h' }); showToast('Đã từ chối hoàn tiền.'); render(); } catch (e) { showToast(e.message); }
          }));
          panel.querySelectorAll('[data-rf-comp]').forEach((b) => b.addEventListener('click', async () => {
            try { await api.post(`/admin/refunds/${b.getAttribute('data-rf-comp')}/complete`, { bank_reference_code: 'CK_' + Date.now() }); showToast('Đã hoàn tất chuyển khoản hoàn tiền.'); render(); } catch (e) { showToast(e.message); }
          }));
        } else if (activeTab === 'payments') {
          const payData = await api.get('/admin/payments?per_page=30').catch(() => []);
          const payments = Array.isArray(payData) ? payData : (payData?.payments || payData?.items || []);
          panel.innerHTML = `
            <h2 class="portal-panel-title">Danh Sách Giao Dịch Thanh Toán Hệ Thống</h2>
            <div class="portal-table-wrap">
              <table class="portal-table">
                <thead><tr><th>ID</th><th>Người chơi</th><th>Phòng</th><th>Loại</th><th>Số tiền</th><th>Đã thu</th><th>Trạng thái</th></tr></thead>
                <tbody>
                  ${payments.length ? payments.map((p) => `
                    <tr>
                      <td><strong>#${p.id}</strong></td>
                      <td>${p.player_name || p.player_email || ''}</td>
                      <td>#${p.game_room_id || ''} ${p.room_title || ''}</td>
                      <td>${p.payment_type || ''}</td>
                      <td>${formatVND(p.amount)}</td>
                      <td><strong>${formatVND(p.paid_amount)}</strong></td>
                      <td><span class="v-badge ${p.status === 'PAID' ? 'v-badge-green' : 'v-badge-gold'}">${p.status}</span></td>
                    </tr>
                  `).join('') : '<tr><td colspan="7" class="text-muted">Chưa có giao dịch thanh toán nào.</td></tr>'}
                </tbody>
              </table>
            </div>
          `;
        } else if (activeTab === 'hssv') {
          panel.innerHTML = `
            <h2 class="portal-panel-title">Danh Sách Tài Khoản, Phân Quyền &amp; Xét Duyệt Thẻ HSSV</h2>
            <div class="portal-table-wrap">
              <table class="portal-table">
                <thead><tr><th>ID</th><th>Họ tên</th><th>Email</th><th>Vai trò</th><th>Thẻ HSSV</th><th>Thao tác</th></tr></thead>
                <tbody>
                  ${users.map((u) => {
                    const roleCode = String(u.role_code || u.role || 'PLAYER').toUpperCase();
                    const isPlayerAcc = roleCode === 'PLAYER';
                    const isSelf = currentAdminId > 0 && Number(u.id) === currentAdminId;
                    const isSuspended = String(u.status || 'ACTIVE').toUpperCase() === 'SUSPENDED';
                    return `
                    <tr>
                      <td><strong>#${u.id}</strong></td>
                      <td>${escapeHtml(u.full_name || '')}${isSelf ? ' <span class="text-muted" style="font-size:0.75rem;">(Bạn)</span>' : ''}</td>
                      <td>${escapeHtml(u.email || '')}</td>
                      <td>
                        ${isSelf
                          ? `<span class="v-badge v-badge-gold">${roleCode}</span>`
                          : `<select class="portal-select" data-role-sel="${u.id}" style="min-width:100px;">
                              ${['PLAYER', 'DM', 'ADMIN'].map((rc) => `<option value="${rc}" ${rc === roleCode ? 'selected' : ''}>${rc}</option>`).join('')}
                            </select>`}
                      </td>
                      <td>
                        ${isPlayerAcc ? `
                          <span class="v-badge ${u.student_verified ? 'v-badge-green' : u.student_card_status === 'PENDING' ? 'v-badge-gold' : 'v-badge-muted'}">${u.student_verified ? 'ĐÃ DUYỆT' : u.student_card_status === 'PENDING' ? 'CHỜ DUYỆT' : 'CHƯA NỘP'}</span>
                          ${u.student_card_url ? `<div style="font-size:0.75rem;margin-top:3px;"><span class="text-muted">Đã nộp ảnh thẻ</span></div>` : ''}
                        ` : `<span class="text-muted" style="font-size:0.82rem;">Nội bộ (${roleCode})</span>`}
                      </td>
                      <td style="display:flex;gap:6px;flex-wrap:wrap;">
                        ${isPlayerAcc ? `<button class="btn btn-gold btn-sm" data-sv-toggle="${u.id}" data-sv-val="${u.student_verified ? 0 : 1}">${u.student_verified ? 'Hủy HSSV' : 'Duyệt HSSV'}</button>` : ''}
                        ${!isSelf ? `
                          <button class="btn btn-ghost btn-sm" data-role-save="${u.id}">Lưu Role</button>
                          <button class="btn btn-ghost btn-sm" data-status-toggle="${u.id}" data-next-status="${isSuspended ? 'ACTIVE' : 'SUSPENDED'}">${isSuspended ? 'Mở khóa' : 'Khóa'}</button>
                        ` : `<span class="text-muted" style="font-size:0.8rem;">Tài khoản hiện tại</span>`}
                      </td>
                    </tr>
                  `; }).join('')}
                </tbody>
              </table>
            </div>
          `;
          panel.querySelectorAll('[data-sv-toggle]').forEach((b) => b.addEventListener('click', async () => {
            const uid = b.getAttribute('data-sv-toggle');
            const val = Number(b.getAttribute('data-sv-val')) === 1;
            try { await api.post(`/admin/users/${uid}/verify-student`, { student_verified: val, verified: val }); showToast('Đã cập nhật trạng thái HSSV.'); render(); } catch (e) { showToast(e.message); }
          }));
          panel.querySelectorAll('[data-role-save]').forEach((b) => b.addEventListener('click', async () => {
            const uid = b.getAttribute('data-role-save');
            const role = panel.querySelector(`[data-role-sel="${uid}"]`).value;
            try { await api.put(`/admin/users/${uid}/role`, { role_code: role, role }); showToast(`Đã đổi vai trò tài khoản #${uid} sang ${role}.`); render(); } catch (e) { showToast(e.message); }
          }));
          panel.querySelectorAll('[data-status-toggle]').forEach((b) => b.addEventListener('click', async () => {
            const uid = b.getAttribute('data-status-toggle');
            const nextStatus = b.getAttribute('data-next-status');
            try { await api.patch(`/admin/users/${uid}`, { status: nextStatus }); showToast(`Đã cập nhật trạng thái tài khoản #${uid} sang ${nextStatus}.`); render(); } catch (e) { showToast(e.message); }
          }));
        } else {
          const auditData = await api.get('/admin/audit-logs?limit=30').catch(() => ({ logs: [] }));
          const logs = auditData?.logs || auditData?.items || (Array.isArray(auditData) ? auditData : []);
          panel.innerHTML = `
            <h2 class="portal-panel-title">Nhật Ký Kiểm Toán Hệ Thống (Audit Logs)</h2>
            <div class="portal-table-wrap">
              <table class="portal-table">
                <thead><tr><th>Thời gian</th><th>Actor ID</th><th>Hành động</th><th>Đối tượng</th></tr></thead>
                <tbody>
                  ${logs.length ? logs.map((l) => `
                    <tr>
                      <td style="font-family:var(--font-mono);font-size:0.8rem;">${l.created_at || ''}</td>
                      <td>#${l.actor_id || ''}</td>
                      <td><span class="v-badge v-badge-gold">${l.action || ''}</span></td>
                      <td>${l.entity_type || ''} #${l.entity_id || ''}</td>
                    </tr>
                  `).join('') : '<tr><td colspan="4" class="text-muted">Chưa có bản ghi kiểm toán.</td></tr>'}
                </tbody>
              </table>
            </div>
          `;
        }
      } catch (err) {
        panel.innerHTML = `<p class="text-muted">Lỗi tải dữ liệu quản trị: ${err.message}</p>`;
      }
    }

    (async () => {
      const auth = await requireAuthRole(['admin'], 'Cổng Quản Trị Viên (Admin Portal)');
      currentAdminId = Number(auth.user?.id || 0);
      initChrome('admin');
      if (!auth.allowed) return;

      document.querySelectorAll('#admin-tabs .portal-tab').forEach((tab) => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('#admin-tabs .portal-tab').forEach((t) => t.classList.remove('active'));
          tab.classList.add('active');
          activeTab = tab.getAttribute('data-tab');
          render();
        });
      });

      render();
    })();
  </script>
</body>
</html>
