<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sảnh Ghép Phòng — Kịch Bản Sát V16</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../src/styles/components.css" />
  <link rel="stylesheet" href="../src/styles/home.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="../index.html" class="brand-logo">
        <img src="../src/assets/images/logo.png" alt="Logo Kịch Bản Sát" />
        <span>KỊCH BẢN SÁT</span>
      </a>
      <nav class="nav-links">
        <a href="../index.html">Trang chủ</a>
        <a href="./scenarios.html">Kho 42 Kịch Bản</a>
        <a href="./lobby.html" class="active">Sảnh Ghép Phòng</a>
        <a href="./info.html">Bảng Giá & Nội Quy</a>
      </nav>
      <div class="home-header-actions">
        <a href="./create-room.html" class="btn btn-primary">Tự Tạo Phòng Mới</a>
      </div>
    </div>
  </header>

  <main class="container" style="padding-top: 40px; padding-bottom: 60px;">
    <div class="home-section-head">
      <span class="stamp-badge open">SẢNH GHÉP NHÓM TRỰC TUYẾN</span>
      <h1 class="home-section-title" style="margin-top: 8px;">Các Phòng Đang Mở Tuyển Thành Viên</h1>
      <p class="home-section-desc">Gia nhập nhóm thám tử đang thiếu người hoặc mở phòng mới để bạn bè cùng tham gia</p>
    </div>

    <div id="roomsGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 24px; margin-top: 32px;">
      <p style="text-align: center; grid-column: 1/-1; padding: 40px 0;">Đang tải danh sách phòng chơi...</p>
    </div>
  </main>

  <script type="module">
    import { apiClient } from '../src/api/api-client.js';

    const roomsGrid = document.getElementById('roomsGrid');

    async function loadRooms() {
      try {
        const json = await apiClient.get('/rooms');

        if (!json.success || !json.data?.rooms || json.data.rooms.length === 0) {
          renderFallback();
          return;
        }

        roomsGrid.innerHTML = json.data.rooms.map(r => `
          <div class="ticket-card" style="display: flex; flex-direction: column; justify-content: space-between;">
            <div>
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <div style="display: flex; gap: 6px; align-items: center;">
                  <span class="stamp-badge ${r.status === 'FORMING' ? 'open' : ''}">${r.status}</span>
                  ${r.booking_type === 'PRIVATE' ? '<span class="stamp-badge" style="border-color: #b8860b; color: #ffd700;">NHÓM BẠN</span>' : '<span class="stamp-badge" style="border-color: #2e7d32; color: #81c784;">CÔNG KHAI</span>'}
                </div>
                <span style="font-weight: 700; color: #2e7d32;">${r.current_players || 1}/${r.total_players || r.max_players || 8} Slot</span>
              </div>
              <h3 style="margin-bottom: 8px; font-family: var(--font-serif);">${r.title || 'Phòng Án Mạng Nhập Vai'}</h3>
              <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 8px;">${r.game_name || 'Đêm Đoạt Mệnh Tại Trang Viên'}</p>
              ${r.target_venue_name || r.target_time_slot ? `<div style="font-size: 0.82rem; color: #c9a25e; margin-bottom: 10px; background: rgba(201,162,94,0.08); padding: 4px 8px; border-radius: 4px;">Địa điểm: ${r.target_venue_name || 'Chi nhánh Q.1'} | Ca: ${r.target_time_slot || 'Khung giờ linh hoạt'}</div>` : ''}
              <p style="font-size: 0.85rem; line-height: 1.5; margin-bottom: 16px;">${r.description || 'Tìm thám tử cùng phá án, thân thiện, không toxic!'}</p>
            </div>
            <div>
              <hr class="ticket-divider" />
              <div style="display: flex; gap: 8px;">
                <a href="./room-detail.html?id=${r.id}" class="btn btn-outline" style="flex: 1; text-align: center;">Chi tiết</a>
                ${r.booking_type === 'PRIVATE' && (r.guest_slots || 0) === 0 ? `<a href="./room-detail.html?id=${r.id}" class="btn btn-outline" style="flex: 1; text-align: center;">Nhóm Riêng</a>` : `<button type="button" class="btn btn-primary" onclick="joinRoom(${r.id})" style="flex: 1;">Vào Phòng</button>`}
              </div>
            </div>
          </div>
        `).join('');
      } catch (err) {
        renderFallback();
      }
    }

    function renderFallback() {
      roomsGrid.innerHTML = `
        <div class="ticket-card" style="display: flex; flex-direction: column; justify-content: space-between;">
          <div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
              <span class="stamp-badge open">ĐANG TUYỂN</span>
              <span style="font-weight: 700; color: #2e7d32;">5/8 Slot</span>
            </div>
            <h3 style="margin-bottom: 8px; font-family: var(--font-serif);">Tuyển thám tử phá án Đêm Đoạt Mệnh</h3>
            <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 12px;">Đêm Đoạt Mệnh Tại Trang Viên</p>
            <p style="font-size: 0.85rem; line-height: 1.5; margin-bottom: 16px;">Tìm thêm 3 bạn cùng sở thích suy luận, chơi vui vẻ, không toxic!</p>
          </div>
          <div>
            <hr class="ticket-divider" />
            <div style="display: flex; gap: 8px;">
              <a href="./room-detail.html?id=1" class="btn btn-outline" style="flex: 1; text-align: center;">Chi tiết</a>
              <a href="./room-detail.html?id=1" class="btn btn-primary" style="flex: 1; text-align: center;">Vào Phòng</a>
            </div>
          </div>
        </div>
      `;
    }

    window.joinRoom = async function(roomId) {
      try {
        const json = await apiClient.post(`/rooms/${roomId}/join`);
        if (json.success) {
          alert('Tham gia phòng thành công!');
          window.location.href = `./room-detail.html?id=${roomId}`;
        } else {
          alert(json.message || 'Không thể tham gia phòng');
        }
      } catch (err) {
        if (err.status === 401) {
          alert('Vui lòng đăng nhập tài khoản trước khi tham gia phòng!');
          window.location.href = './auth.html';
          return;
        }
        window.location.href = `./room-detail.html?id=${roomId}`;
      }
    };

    loadRooms();
  </script>
</body>
</html>
