<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kho Kịch Bản — Kịch Bản Sát V16</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../src/styles/components.css" />
  <link rel="stylesheet" href="../src/styles/home.css" />
  <style>
    .catalog-search-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .catalog-input {
      flex: 1;
      min-width: 240px;
      padding: 10px 14px;
      border: 1px solid rgba(201, 162, 94, 0.4);
      background: var(--bg-surface);
      color: var(--text-light);
      border-radius: var(--radius-sm);
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="../index.html" class="brand-logo">
        <img src="../src/assets/images/logo.png" alt="Logo Kịch Bản Sát" />
        <span>KỊCH BẢN SÁT</span>
      </a>
      <nav class="nav-links">
        <a href="../index.html">Trang chủ</a>
        <a href="./scenarios.html" class="active">Kho Kịch Bản</a>
        <a href="./lobby.html">Sảnh Ghép Phòng</a>
        <a href="./info.html">Bảng Giá & Nội Quy</a>
      </nav>
      <div class="home-header-actions">
        <a href="./auth.html" id="headerAccountLink" class="btn btn-outline">Tài Khoản</a>
        <a href="./create-room.html" class="btn btn-primary">Tạo Phòng Ngay</a>
      </div>
    </div>
  </header>

  <main class="container" style="padding-top: 40px; padding-bottom: 60px;">
    <div class="home-section-head">
      <span class="stamp-badge">BỘ SƯU TẬP CHÍNH THỨC</span>
      <h1 class="home-section-title" style="margin-top: 8px;">Kho Kịch Bản Án Mạng Nhập Vai</h1>
      <p class="home-section-desc">Khám phá các vụ án ly kỳ được thiết kế chuẩn quốc tế, trang phục và đạo cụ chi tiết</p>
    </div>

    <div class="catalog-search-bar">
      <input type="text" id="searchInput" class="catalog-input" placeholder="Tìm theo tên kịch bản, từ khóa... (nhấn / để tìm nhanh)" />
      <select id="playerFilter" class="catalog-input" style="flex: 0 0 200px;">
        <option value="">Tất cả số người</option>
        <option value="5">5 người chơi</option>
        <option value="6">6 người chơi</option>
        <option value="7">7 người chơi</option>
        <option value="8">8 người chơi</option>
        <option value="9">9 người chơi</option>
      </select>
    </div>

    <div class="home-filter-bar" id="genreFilters">
      <button class="btn btn-gold active" data-genre="ALL">Tất cả thể loại</button>
      <button class="btn btn-outline" data-genre="Kinh dị">Kinh dị tâm linh</button>
      <button class="btn btn-outline" data-genre="Suy luận">Suy luận phá án</button>
      <button class="btn btn-outline" data-genre="Cơ chế">Cơ chế hài hước</button>
      <button class="btn btn-outline" data-genre="Tình cảm">Tình cảm tâm lý</button>
      <button class="btn btn-outline" data-genre="Giả tưởng">Giả tưởng</button>
    </div>

    <div class="home-scenarios-grid" id="scenariosGrid">
      <p style="text-align: center; grid-column: 1/-1; padding: 40px 0;">Đang tải danh mục kịch bản...</p>
    </div>
  </main>

  <script type="module">
    import { apiClient } from '../src/api/api-client.js';
    import { SCENARIOS } from '../src/data/scripts.data.js';
    import { escapeHtml, sanitizeUrl } from '../src/utils/sanitize.js';

    let allScenarios = [];
    let currentGenre = 'ALL';
    let currentSearch = '';
    let currentPlayerFilter = '';

    const scenariosGrid = document.getElementById('scenariosGrid');
    const genreFilters = document.getElementById('genreFilters');
    const searchInput = document.getElementById('searchInput');
    const playerFilter = document.getElementById('playerFilter');

    function mapApiGame(g) {
      const name = String(g.name || '');
      const desc = String(g.description || '');
      const text = (name + ' ' + desc).toLowerCase();

      let genre = 'Suy luận phá án';
      let difficulty = 'Trung bình';
      const is18Plus = name.includes('18+') || text.includes('đẫm máu') || text.includes('hiến tế');

      if (text.includes('ma cà rồng') || text.includes('huyết tộc') || text.includes('hắc miêu') || text.includes('đẫm máu') || text.includes('số 13')) {
        genre = 'Kinh dị tâm linh';
        difficulty = 'Khó';
      } else if (text.includes('học đường') || text.includes('hài hước') || text.includes('trộm đề')) {
        genre = 'Cơ chế hài hước';
        difficulty = 'Dễ';
      } else if (text.includes('không gian') || text.includes('viễn tưởng')) {
        genre = 'Giả tưởng';
        difficulty = 'Khó';
      } else if (text.includes('giao hưởng') || text.includes('gatsby') || text.includes('dạ hội')) {
        genre = 'Tình cảm tâm lý';
        difficulty = 'Trung bình';
      }

      const mins = Number(g.duration_minutes || 240);
      const hrs = (mins / 60).toFixed(1).replace('.0', '');
      return {
        id: g.id,
        title: name,
        genre,
        difficulty,
        duration: `${hrs} tiếng (${mins}p)`,
        duration_minutes: mins,
        price: Number(g.min_price || 220000),
        max_price: Number(g.max_price || g.min_price || 250000),
        is18Plus,
        min_players: Number(g.min_players || 6),
        max_players: Number(g.max_players || 8),
        image_url: sanitizeUrl(g.image_url) || 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=500&auto=format&fit=crop',
        summary: desc
      };
    }

    function render() {
      const filtered = allScenarios.filter(item => {
        const matchGenre = currentGenre === 'ALL' || String(item.genre || '').toLowerCase().includes(currentGenre.toLowerCase());
        const matchSearch = !currentSearch || String(item.title || '').toLowerCase().includes(currentSearch.toLowerCase()) || String(item.summary || '').toLowerCase().includes(currentSearch.toLowerCase());
        const pf = Number(currentPlayerFilter);
        const matchPlayer = !currentPlayerFilter || (Number(item.min_players) <= pf && Number(item.max_players) >= pf);
        return matchGenre && matchSearch && matchPlayer;
      });

      if (filtered.length === 0) {
        scenariosGrid.innerHTML = '<p style="text-align: center; grid-column: 1/-1; color: var(--text-muted); padding: 40px 0;">Không tìm thấy kịch bản phù hợp với tiêu chí lọc.</p>';
        return;
      }

      scenariosGrid.innerHTML = filtered.map(item => {
        const safeTitle = escapeHtml(item.title);
        const safeGenre = escapeHtml(item.genre);
        const safeSummary = escapeHtml(item.summary || '');
        const minP = Number(item.min_players || 6);
        const maxP = Number(item.max_players || 8);
        const male = Math.ceil(minP / 2);
        const female = Math.max(1, minP - male);
        const imgSrc = item.image_url || 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=500&auto=format&fit=crop';
        return `
        <div class="home-flip-card">
          <div class="home-flip-inner">
            <div class="home-flip-front">
              <img src="${imgSrc}" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=500&auto=format&fit=crop';" alt="${safeTitle}" />
              <div class="home-flip-front-info">
                <div class="home-card-tags">
                  <span>${safeGenre}</span>
                  ${item.is18Plus ? '<span class="stamp-badge">18+</span>' : '<span>' + escapeHtml(item.duration) + '</span>'}
                </div>
                <h3>${safeTitle}</h3>
                <div class="home-card-tags">
                  <span>${minP}-${maxP} người</span>
                  <span>${male}N - ${female}N</span>
                  <strong>${Number(item.price || 220000).toLocaleString('vi-VN')}đ</strong>
                </div>
              </div>
            </div>

            <div class="home-flip-back">
              <div>
                <span class="stamp-badge ${item.is18Plus ? '' : 'open'}">
                  ${item.is18Plus ? 'GIỚI HẠN 18+' : escapeHtml(item.difficulty || 'Trung bình')}
                </span>
                <h3>${safeTitle}</h3>
                <p style="font-size: 0.9rem; margin-bottom: 12px;">${safeSummary}</p>
                <hr class="ticket-divider" />
                <ul class="home-spec-list">
                  <li><strong>Thời lượng:</strong> ${escapeHtml(item.duration)}</li>
                  <li><strong>Số lượng:</strong> ${minP} - ${maxP} người chơi</li>
                  <li><strong>Tỷ lệ vai:</strong> ${male} Nam - ${female} Nữ (Hỗ trợ đóng chéo vai)</li>
                  <li><strong>Tiền cọc:</strong> 50.000đ / người (Cố định)</li>
                </ul>
              </div>

              <div style="display: flex; gap: 8px; margin-top: 16px;">
                <a href="./scenario-detail.html?id=${encodeURIComponent(item.id)}" class="btn btn-outline" style="flex: 1; text-align: center;">Chi tiết</a>
                <a href="./create-room.html?game_id=${encodeURIComponent(item.id)}" class="btn btn-primary" style="flex: 1; text-align: center;">Tạo phòng</a>
              </div>
            </div>
          </div>
        </div>
      `;
      }).join('');
    }

    genreFilters.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-genre]');
      if (!btn) return;
      genreFilters.querySelectorAll('button').forEach(b => {
        b.classList.remove('btn-gold', 'active');
        b.classList.add('btn-outline');
      });
      btn.classList.remove('btn-outline');
      btn.classList.add('btn-gold', 'active');
      currentGenre = btn.dataset.genre;
      render();
    });

    searchInput.addEventListener('input', (e) => {
      currentSearch = e.target.value.trim();
      render();
    });

    playerFilter.addEventListener('change', (e) => {
      currentPlayerFilter = e.target.value;
      render();
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement !== searchInput) {
        e.preventDefault();
        searchInput.focus();
      } else if (e.key === 'Escape' && document.activeElement === searchInput) {
        searchInput.value = '';
        currentSearch = '';
        searchInput.blur();
        render();
      }
    });

    // Sync header auth
    apiClient.get('/auth/me')
      .then(me => {
        if (me.success && me.data?.user) {
          const acc = document.getElementById('headerAccountLink');
          if (acc) {
            acc.textContent = me.data.user.full_name || 'Hồ Sơ';
            acc.href = './profile.html';
          }
        }
      })
      .catch(() => {});

    // Load 100% live games from backend API (fallback to SCENARIOS only if API unavailable)
    apiClient.get('/games?limit=50')
      .then(json => {
        if (json.success && Array.isArray(json.data?.games) && json.data.games.length > 0) {
          allScenarios = json.data.games.map(mapApiGame);
        } else {
          allScenarios = SCENARIOS || [];
        }
        render();
      })
      .catch(() => {
        allScenarios = SCENARIOS || [];
        render();
      });
  </script>
</body>
</html>
