<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kho 42 Kịch Bản — Kịch Bản Sát V16</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../src/styles/components.css" />
  <link rel="stylesheet" href="../src/styles/home.css" />
  <style>
    .catalog-search-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .catalog-input {
      flex: 1;
      min-width: 260px;
      padding: 10px 14px;
      border: 1px solid rgba(201, 162, 94, 0.4);
      background: var(--bg-surface);
      color: var(--text-light);
      border-radius: var(--radius-sm);
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="../index.html" class="brand-logo">
        <img src="../src/assets/images/logo.png" alt="Logo Kịch Bản Sát" />
        <span>KỊCH BẢN SÁT</span>
      </a>
      <nav class="nav-links">
        <a href="../index.html">Trang chủ</a>
        <a href="./scenarios.html" class="active">Kho 42 Kịch Bản</a>
        <a href="./lobby.html">Sảnh Ghép Phòng</a>
        <a href="./info.html">Bảng Giá & Nội Quy</a>
      </nav>
      <div class="home-header-actions">
        <a href="./auth.html" class="btn btn-outline">Tài Khoản</a>
        <a href="./create-room.html" class="btn btn-primary">Tạo Phòng Ngay</a>
      </div>
    </div>
  </header>

  <main class="container" style="padding-top: 40px; padding-bottom: 60px;">
    <div class="home-section-head">
      <span class="stamp-badge">BỘ SƯU TẬP CHÍNH THỨC</span>
      <h1 class="home-section-title" style="margin-top: 8px;">Kho Kịch Bản Án Mạng Nhập Vai</h1>
      <p class="home-section-desc">Khám phá các vụ án ly kỳ được thiết kế chuẩn quốc tế, trang phục và đạo cụ chi tiết</p>
    </div>

    <div class="catalog-search-bar">
      <input type="text" id="searchInput" class="catalog-input" placeholder="Tìm theo tên kịch bản, từ khóa..." />
      <select id="playerFilter" class="catalog-input" style="flex: 0 0 200px;">
        <option value="">Tất cả số người</option>
        <option value="6">6 người chơi</option>
        <option value="7">7 người chơi</option>
        <option value="8">8 người chơi</option>
      </select>
    </div>

    <div class="home-filter-bar" id="genreFilters">
      <button class="btn btn-gold active" data-genre="ALL">Tất cả thể loại</button>
      <button class="btn btn-outline" data-genre="Kinh dị">Kinh dị tâm linh</button>
      <button class="btn btn-outline" data-genre="Suy luận">Suy luận phá án</button>
      <button class="btn btn-outline" data-genre="Cơ chế">Cơ chế hài hước</button>
      <button class="btn btn-outline" data-genre="Tình cảm">Tình cảm tâm lý</button>
      <button class="btn btn-outline" data-genre="Giả tưởng">Giả tưởng</button>
    </div>

    <div class="home-scenarios-grid" id="scenariosGrid">
      <p style="text-align: center; grid-column: 1/-1; padding: 40px 0;">Đang tải danh mục kịch bản...</p>
    </div>
  </main>

  <script type="module">
    import { SCENARIOS } from '../src/data/scripts.data.js';

    let allScenarios = SCENARIOS || [];
    let currentGenre = 'ALL';
    let currentSearch = '';
    let currentPlayerFilter = '';

    const scenariosGrid = document.getElementById('scenariosGrid');
    const genreFilters = document.getElementById('genreFilters');
    const searchInput = document.getElementById('searchInput');
    const playerFilter = document.getElementById('playerFilter');

    function render() {
      let filtered = allScenarios.filter(item => {
        const matchGenre = currentGenre === 'ALL' || item.genre.toLowerCase().includes(currentGenre.toLowerCase());
        const matchSearch = !currentSearch || item.title.toLowerCase().includes(currentSearch.toLowerCase()) || item.summary.toLowerCase().includes(currentSearch.toLowerCase());
        const matchPlayer = !currentPlayerFilter || (item.players && item.players.total == currentPlayerFilter) || (item.min_players <= currentPlayerFilter && item.max_players >= currentPlayerFilter);
        return matchGenre && matchSearch && matchPlayer;
      });

      if (filtered.length === 0) {
        scenariosGrid.innerHTML = '<p style="text-align: center; grid-column: 1/-1; color: var(--text-muted); padding: 40px 0;">Không tìm thấy kịch bản phù hợp với tiêu chí lọc.</p>';
        return;
      }

      scenariosGrid.innerHTML = filtered.map(item => `
        <div class="home-flip-card">
          <div class="home-flip-inner">
            <div class="home-flip-front">
              <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=500&auto=format&fit=crop" alt="${item.title}" />
              <div class="home-flip-front-info">
                <div class="home-card-tags">
                  <span>${item.genre}</span>
                  ${item.is18Plus ? '<span class="stamp-badge">18+</span>' : '<span>' + (item.duration || '4 tiếng') + '</span>'}
                </div>
                <h3>${item.title}</h3>
                <div class="home-card-tags">
                  <span>👥 ${item.players?.total || item.min_players || 6} người</span>
                  <strong>${(item.price || 220000).toLocaleString('vi-VN')}đ</strong>
                </div>
              </div>
            </div>

            <div class="home-flip-back">
              <div>
                <span class="stamp-badge ${item.is18Plus ? '' : 'open'}">
                  ${item.is18Plus ? 'GIỚI HẠN 18+' : (item.difficulty || 'Trung bình')}
                </span>
                <h3>${item.title}</h3>
                <p style="font-size: 0.9rem; margin-bottom: 12px;">${item.summary || item.description || ''}</p>
                <hr class="ticket-divider" />
                <ul class="home-spec-list">
                  <li><strong>Thời lượng:</strong> ${item.duration || (item.duration_minutes ? item.duration_minutes + ' phút' : '4 tiếng')}</li>
                  <li><strong>Số lượng:</strong> ${item.players?.total || `${item.min_players} - ${item.max_players}`} người chơi</li>
                  <li><strong>Tiền cọc:</strong> 50.000đ / người (Cố định)</li>
                </ul>
              </div>

              <div style="display: flex; gap: 8px; margin-top: 16px;">
                <a href="./scenario-detail.html?id=${item.id}" class="btn btn-outline" style="flex: 1; text-align: center;">Chi tiết</a>
                <a href="./create-room.html?game_id=${item.id}" class="btn btn-primary" style="flex: 1; text-align: center;">Tạo phòng</a>
              </div>
            </div>
          </div>
        </div>
      `).join('');
    }

    genreFilters.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-genre]');
      if (!btn) return;
      genreFilters.querySelectorAll('button').forEach(b => {
        b.classList.remove('btn-gold', 'active');
        b.classList.add('btn-outline');
      });
      btn.classList.remove('btn-outline');
      btn.classList.add('btn-gold', 'active');
      currentGenre = btn.dataset.genre;
      render();
    });

    searchInput.addEventListener('input', (e) => {
      currentSearch = e.target.value.trim();
      render();
    });

    playerFilter.addEventListener('change', (e) => {
      currentPlayerFilter = e.target.value;
      render();
    });

    // Try fetching live games from backend API
    fetch('/api/v1/games')
      .then(res => res.json())
      .then(json => {
        if (json.success && json.data.games && json.data.games.length > 0) {
          const apiGames = json.data.games.map(g => ({
            id: g.id,
            title: g.name,
            genre: 'Suy luận phá án',
            difficulty: 'Trung bình',
            duration: g.duration_minutes ? `${g.duration_minutes} phút` : '4 tiếng',
            price: g.min_price || 220000,
            is18Plus: false,
            min_players: g.min_players,
            max_players: g.max_players,
            summary: g.description
          }));
          // Merge unique
          const map = new Map();
          SCENARIOS.forEach(s => map.set(s.id, s));
          apiGames.forEach(g => map.set(String(g.id), g));
          allScenarios = Array.from(map.values());
        }
        render();
      })
      .catch(() => {
        render();
      });
  </script>
</body>
</html>
