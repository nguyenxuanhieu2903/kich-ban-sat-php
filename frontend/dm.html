<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trang DM — Cổng Quản Trò Kịch Bản Sát V16</title>
  <link rel="stylesheet" href="./src/styles/variables.css" />
  <link rel="stylesheet" href="./src/styles/base.css" />
  <link rel="stylesheet" href="./src/styles/main.css" />
  <link rel="stylesheet" href="./src/styles/components.css" />
  <link rel="stylesheet" href="./src/styles/home.css" />
  <link rel="stylesheet" href="./src/styles/pages.css" />
  <link rel="stylesheet" href="./src/styles/portal-themes.css" />
</head>
<body class="is-dm-portal theme-dm">
  <div id="role-demo-bar" class="role-demo-bar"></div>
  <header id="app-site-header" class="site-header"></header>

  <main class="page-shell">
    <div id="dm-mount" class="container" style="padding: 24px 20px 60px;">
      <div style="text-align: center; padding: 60px 20px; color: var(--text-muted);">
        Đang khởi tạo Cổng Quản Trò (DM Portal)...
      </div>
    </div>
  </main>

  <footer id="app-footer"></footer>

  <script type="module">
    import { authState } from './src/api/auth-state.js';
    import { initSharedChrome } from './src/utils/shared-header.js';
    import { AuthModal } from './src/pages/auth/auth-modal.js';
    import { DmView } from './src/pages/dm/dm-view.js';

    async function initDmPortal() {
      try {
        await authState.checkSession();
      } catch {
        // guest
      }

      initSharedChrome('dm');

      const dmMount = document.getElementById('dm-mount');
      let dmView = null;

      const authModal = new AuthModal(() => {
        initSharedChrome('dm');
        dmView?.render();
      });
      authModal.render();

      document.getElementById('btn-open-login')?.addEventListener('click', () => {
        authModal.show(false, 'DM');
      });

      dmView = new DmView(dmMount, () => authModal.show(false, 'DM'));
      await dmView.render();
    }

    initDmPortal();
  </script>
</body>
</html>
