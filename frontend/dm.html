<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trang DM — Cổng Quản Trò Dẫn Ca Kịch Bản Sát V16</title>
  <link rel="stylesheet" href="./src/styles/tokens.css" />
  <link rel="stylesheet" href="./src/styles/variables.css" />
  <link rel="stylesheet" href="./src/styles/base.css" />
  <link rel="stylesheet" href="./src/styles/main.css" />
  <link rel="stylesheet" href="./src/styles/components.css" />
  <link rel="stylesheet" href="./src/styles/home.css" />
  <link rel="stylesheet" href="./src/styles/pages.css" />
  <link rel="stylesheet" href="./src/styles/portal-themes.css" />
</head>
<body class="is-dm-portal theme-dm">
  <!-- Top Role Demo Bar -->
  <div id="role-demo-bar" class="role-demo-bar"></div>

  <!-- Site Header -->
  <header id="app-site-header" class="site-header"></header>

  <!-- Main Container -->
  <main class="page-shell">
    <div class="container" style="padding: 24px 20px 60px;">
      <!-- THANH TRẠNG THÁI ĐẦU TRANG DM (TACTICAL COMMAND CENTER) -->
      <div class="dm-command-bar">
        <div>
          <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px;">
            <span class="badge" style="background: rgba(245, 158, 11, 0.2); color: #fde68a; border: 1px solid rgba(245, 158, 11, 0.4); font-size: 0.75rem; font-weight: 700;">📜 DUNGEON MASTER CONSOLE</span>
          </div>
          <h1 style="font-family: var(--font-display); font-size: 1.65rem; margin: 4px 0 4px; color: #f3f4f6;" id="dm-page-title">
            Quản trò Hoàng Nam
          </h1>
          <p style="margin: 0; font-size: 0.88rem; color: #9ca3af;">
            Chuyên môn: Trinh thám tâm lý nặng, án mạng biệt thự &amp; kinh dị phòng kín &bull; 36/52 Nguyễn Gia Trí
          </p>
        </div>

        <label class="dm-avail-pill" style="cursor: pointer;">
          <span id="dm-avail-label" style="font-weight: 600; color: #10b981; font-size: 0.9rem;">Sẵn sàng nhận ca mới</span>
          <span class="switch">
            <input type="checkbox" id="dm-avail-switch" checked />
            <span class="slider"></span>
          </span>
        </label>
      </div>

      <!-- MAIN CONTENT ROOT -->
      <div id="dm-main-content">
        <!-- 3 TABS CÔNG VIỆC -->
        <div class="dm-tabs-row">
          <button class="tab-btn dm-tab-btn active" data-dmtab="new">
            <span>⚡</span> 1. Yêu cầu dẫn ca mới
          </button>
          <button class="tab-btn dm-tab-btn" data-dmtab="upcoming">
            <span>📅</span> 2. Lịch dẫn sắp tới
          </button>
          <button class="tab-btn dm-tab-btn" data-dmtab="history">
            <span>📜</span> 3. Lịch sử đã hoàn thành
          </button>
        </div>

        <!-- DANH SÁCH CA DẪN -->
        <div id="dm-assignments-container" style="display: grid; gap: 14px; margin-bottom: 32px;">
          <div style="text-align: center; padding: 40px; color: #9ca3af;">Đang tải lịch trình Quản trò...</div>
        </div>

        <!-- CHI TIẾT CA DẪN & BẢNG ĐIỂM DANH CHECK-IN MOBILE -->
        <section id="session-detail-section" class="dm-briefing-desk">
          <div id="session-detail-content">
            <div style="text-align: center; padding: 24px; color: #9ca3af;">
              Chọn một ca trực ở trên để mở bảng điểm danh Check-in tại quán và tóm tắt kịch bản.
            </div>
          </div>
        </section>
      </div>
    </div>
  </main>

  <!-- DIALOG TỪ CHỐI CA (KÈM LÝ DO BẮT BUỘC) -->
  <dialog id="dm-reject-dialog" style="padding: 24px; background: var(--bg-surface); border: 1px solid var(--crimson); border-radius: 10px; color: var(--text-primary); max-width: 500px; width: 90%; margin: auto;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;">
      <h3 style="margin: 0; font-size: 1.25rem; font-family: var(--font-display); color: var(--crimson-bright);">Từ Chối Ca Dẫn Truyện</h3>
      <button id="btn-close-reject-dialog" style="background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-secondary);">&times;</button>
    </div>
    <form id="dm-reject-form">
      <input type="hidden" id="dm-reject-assign-id" />
      <div class="form-group" style="margin-bottom: 16px;">
        <label class="form-label" style="display: block; margin-bottom: 6px; font-size: 0.88rem;">
          Lý do từ chối ca làm việc <span style="color: var(--crimson-bright);">* (Bắt buộc)</span>:
        </label>
        <textarea id="dm-reject-reason" required rows="3" class="form-control" style="width: 100%; box-sizing: border-box; resize: vertical;" placeholder="Nhập lý do chi tiết (VD: Trùng lịch thi, việc đột xuất, sức khỏe không đảm bảo...)"></textarea>
      </div>
      <div style="display: flex; justify-content: flex-end; gap: 10px;">
        <button type="button" id="btn-cancel-reject" class="btn btn-ghost btn-sm">Hủy bỏ</button>
        <button type="submit" class="btn btn-crimson btn-sm">Xác nhận Từ Chối</button>
      </div>
    </form>
  </dialog>

  <!-- Site Footer -->
  <div id="app-footer"></div>

  <script type="module">
    import { authState } from './src/api/auth-state.js';
    import { api } from './src/api/api-client.js';
    import { toast } from './src/utils/toast.js';
    import { escapeHtml, sanitizeUrl } from './src/utils/sanitize.js';
    import { initSharedChrome } from './src/utils/shared-header.js';
    import { AuthModal } from './src/pages/auth/auth-modal.js';

    let dmTab = 'new';
    let authModalInstance = null;
    let selectedRoomId = null;
    let liveAssignments = [];

    async function initDmPage() {
      initSharedChrome('dm');

      authModalInstance = new AuthModal((user) => {
        initSharedChrome('dm');
        renderDmView();
      });
      authModalInstance.render();

      const openLoginBtn = document.getElementById('btn-open-login');
      if (openLoginBtn) {
        openLoginBtn.addEventListener('click', () => authModalInstance.show(false, 'DM'));
      }

      try {
        await authState.checkSession();
      } catch (e) {
        console.warn('Session check:', e);
      }

      initDmTabEvents();
      renderDmView();
    }

    function initDmTabEvents() {
      document.querySelectorAll('[data-dmtab]').forEach(btn => {
        btn.addEventListener('click', () => {
          dmTab = btn.dataset.dmtab;
          document.querySelectorAll('[data-dmtab]').forEach(b => b.classList.toggle('active', b === btn));
          renderDmAssignmentsList();
        });
      });

      const availSwitch = document.getElementById('dm-avail-switch');
      const availLabel = document.getElementById('dm-avail-label');
      if (availSwitch && availLabel) {
        availSwitch.addEventListener('change', () => {
          const isAvail = availSwitch.checked;
          availLabel.textContent = isAvail ? 'Sẵn sàng nhận ca mới' : 'Đang tạm nghỉ nhận ca';
          availLabel.style.color = isAvail ? '#5CD68D' : 'var(--text-dim)';
          toast.info(isAvail ? 'Bạn đã bật trạng thái nhận ca trực.' : 'Bạn đã chuyển sang chế độ tạm nghỉ.');
        });
      }
    }

    async function renderDmView() {
      const user = authState.getUser();
      const mainContent = document.getElementById('dm-main-content');

      if (!user) {
        mainContent.innerHTML = `
          <div class="paper-ticket" style="padding: 40px; text-align: center; max-width: 580px; margin: 40px auto;">
            <span class="badge badge-18">KHU VỰC QUẢN TRÒ (DM)</span>
            <h2 style="font-family: var(--font-display); font-size: 1.6rem; margin: 12px 0 8px;">Đăng Nhập Cổng Quản Trò</h2>
            <p style="color: var(--ink-muted); font-size: 0.92rem; margin-bottom: 24px;">
              Trang này dành riêng cho Game Master (DM) để tiếp nhận ca phân công, quản lý đạo cụ và điểm danh người chơi.
            </p>
            <div style="display: flex; justify-content: center; gap: 12px; flex-wrap: wrap;">
              <button id="btn-quick-dm-login" class="btn btn-gold">
                📜 Đăng nhập Quản trò Hoàng Nam (dm.nam@kichbansat.vn)
              </button>
              <button id="btn-custom-dm-login" class="btn btn-ghost" style="color: #111; border-color: #999;">
                Tùy chọn đăng nhập
              </button>
            </div>
          </div>
        `;
        document.getElementById('btn-quick-dm-login').onclick = async () => {
          try {
            await authState.login('dm.nam@kichbansat.vn', 'password123');
            toast.success('Chào mừng Quản trò Hoàng Nam trở lại!');
            initSharedChrome('dm');
            renderDmView();
          } catch (err) {
            toast.error(err.message || 'Lỗi đăng nhập');
          }
        };
        document.getElementById('btn-custom-dm-login').onclick = () => authModalInstance.show(false, 'DM');
        return;
      }

      if (user.role !== 'DM' && user.role !== 'ADMIN') {
        mainContent.innerHTML = `
          <div class="paper-ticket" style="padding: 40px; text-align: center; max-width: 580px; margin: 40px auto; border-color: var(--crimson);">
            <span class="badge badge-18">YÊU CẦU QUYỀN QUẢN TRÒ</span>
            <h2 style="font-family: var(--font-display); font-size: 1.6rem; margin: 12px 0 8px; color: var(--crimson);">Chỉ Dành Cho Quản Trò (DM)</h2>
            <p style="color: var(--ink-muted); font-size: 0.92rem; margin-bottom: 20px;">
              Tài khoản hiện tại của bạn là <strong>${escapeHtml(user.name)}</strong> (Vai trò: <strong>${escapeHtml(user.role)}</strong>). Vui lòng chuyển sang tài khoản DM để tiếp tục.
            </p>
            <button id="btn-switch-to-dm" class="btn btn-crimson">
              Chuyển sang Quản Trò Hoàng Nam (1-click)
            </button>
          </div>
        `;
        document.getElementById('btn-switch-to-dm').onclick = async () => {
          try {
            await authState.login('dm.nam@kichbansat.vn', 'password123');
            toast.success('Đã chuyển sang tài khoản DM Hoàng Nam!');
            initSharedChrome('dm');
            renderDmView();
          } catch (err) {
            toast.error(err.message || 'Lỗi đăng nhập');
          }
        };
        return;
      }

      // Update name title
      document.getElementById('dm-page-title').textContent = user.name;

      renderDmAssignmentsList();
      renderSessionDetail();
    }

    async function renderDmAssignmentsList() {
      const container = document.getElementById('dm-assignments-container');
      try {
        const res = await api.get('/dm/assignments');
        liveAssignments = res?.data?.assignments || [];
      } catch {
        liveAssignments = [];
      }

      const filtered = liveAssignments.filter(item => {
        const st = (item.status || 'PENDING').toUpperCase();
        if (dmTab === 'new') return st === 'PENDING';
        if (dmTab === 'upcoming') return st === 'ACCEPTED' || st === 'SCHEDULED';
        return st === 'COMPLETED' || st === 'REJECTED';
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div style="padding: 32px; background: var(--bg-surface); border-radius: 8px; text-align: center; border: 1px dashed var(--color-border);" class="text-muted">
            Không có ca dẫn nào trong mục này.
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(item => `
        <div class="dm-session-card" style="display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap;">
          <div>
            <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px;">
              <span class="badge" style="background: ${item.status === 'ACCEPTED' ? 'rgba(16,185,129,0.2)' : item.status === 'REJECTED' ? 'rgba(239,68,68,0.2)' : 'rgba(245,158,11,0.2)'}; color: ${item.status === 'ACCEPTED' ? '#34d399' : item.status === 'REJECTED' ? '#f87171' : '#fbbf24'}; border: 1px solid ${item.status === 'ACCEPTED' ? 'rgba(16,185,129,0.4)' : item.status === 'REJECTED' ? 'rgba(239,68,68,0.4)' : 'rgba(245,158,11,0.4)'};">
                ${item.status === 'ACCEPTED' ? '✓ Đã nhận ca' : item.status === 'REJECTED' ? '✕ Đã từ chối' : '⚡ Chờ bạn xác nhận'}
              </span>
              <strong style="color: #f59e0b; font-family: var(--font-mono);">#${item.game_room_id || item.room_id || item.id}</strong>
            </div>
            <h3 style="font-family: var(--font-display); font-size: 1.3rem; margin: 4px 0; color: #f3f4f6;">${escapeHtml(item.game_title || item.game_name || 'Kịch bản trinh thám')}</h3>
            <div style="font-size: 0.86rem; color: #9ca3af;">
              📅 ${escapeHtml(item.session_start_at ? new Date(item.session_start_at).toLocaleString('vi-VN') : (item.scheduled_at || 'Chưa xếp giờ'))} &bull; 🚪 ${escapeHtml(item.room_name || item.physical_room || 'Phòng Diễn')} (${escapeHtml(item.venue_name || 'Chi nhánh trung tâm')})
            </div>
          </div>

          <div style="display: flex; gap: 8px; flex-wrap: wrap;">
            ${(item.status === 'PENDING') ? `
              <button class="btn btn-sm" data-dm-accept="${item.id}" style="background: rgba(16,185,129,0.2); color: #34d399; border: 1px solid rgba(16,185,129,0.4); font-weight: 600;">✓ Chấp nhận</button>
              <button class="btn btn-sm" data-dm-reject="${item.id}" style="background: rgba(239,68,68,0.2); color: #f87171; border: 1px solid rgba(239,68,68,0.4); font-weight: 600;">✕ Từ chối</button>
            ` : ''}
            <button class="btn btn-sm" data-dm-inspect="${item.game_room_id || item.room_id || item.id}" style="background: #f59e0b; color: #121214; border: none; font-weight: 700;">
              📋 Điểm danh &amp; Báo cáo
            </button>
          </div>
        </div>
      `).join('');

      container.querySelectorAll('[data-dm-accept]').forEach(b => {
        b.addEventListener('click', async () => {
          const assignId = b.dataset.dmAccept;
          try {
            await api.post(`/dm/assignments/${assignId}/accept`);
            toast.success('Bạn đã chấp nhận ca dẫn! Lịch trực đã được ghi nhận.');
            renderDmAssignmentsList();
          } catch (err) {
            toast.error(err.message || 'Lỗi chấp nhận ca');
          }
        });
      });

      container.querySelectorAll('[data-dm-reject]').forEach(b => {
        b.addEventListener('click', () => {
          document.getElementById('dm-reject-assign-id').value = b.dataset.dmReject;
          document.getElementById('dm-reject-dialog').showModal();
        });
      });

      container.querySelectorAll('[data-dm-inspect]').forEach(b => {
        b.addEventListener('click', () => {
          selectedRoomId = b.dataset.dmInspect;
          renderSessionDetail();
          document.getElementById('session-detail-section').scrollIntoView({ behavior: 'smooth' });
        });
      });
    }

    async function renderSessionDetail() {
      const detailRoot = document.getElementById('session-detail-content');
      if (!selectedRoomId) {
        detailRoot.innerHTML = `<div style="text-align: center; padding: 20px;" class="text-muted">Chọn một ca trực ở trên để mở bảng điểm danh Check-in tại quán.</div>`;
        return;
      }

      detailRoot.innerHTML = `<div style="text-align: center; padding: 20px;" class="text-muted">Đang tải chi tiết phòng #${selectedRoomId}...</div>`;

      let room = null;
      try {
        const res = await api.get(`/rooms/${selectedRoomId}`);
        room = res?.data?.room || res?.data || null;
      } catch (err) {
        detailRoot.innerHTML = `<div style="color: var(--crimson-bright); padding: 20px;">Không thể tải dữ liệu phòng: ${escapeHtml(err.message)}</div>`;
        return;
      }

      if (!room) {
        detailRoot.innerHTML = `<div class="text-muted" style="padding: 20px;">Không tìm thấy thông tin phòng #${selectedRoomId}.</div>`;
        return;
      }

      const assignment = liveAssignments.find(x => (x.game_room_id == selectedRoomId || x.room_id == selectedRoomId || x.id == selectedRoomId)) || {};
      const players = room.participants || [];
      const presentCount = players.filter(p => p.checkedIn || p.status === 'DEPOSITED').length;

      detailRoot.innerHTML = `
        <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 14px; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 16px;">
          <div>
            <span class="badge badge-18">CHI TIẾT CA DẪN #${room.id}</span>
            <h2 style="font-family: var(--font-display); font-size: 1.5rem; margin: 8px 0 4px;">
              ${escapeHtml(room.game_name || assignment.game_title || room.title || 'Kịch bản')}
            </h2>
            <p class="text-gold" style="font-size: 0.9rem; margin: 0;">
              🚪 ${escapeHtml(assignment.room_name || assignment.physical_room || 'Phòng Diễn')} &bull; ⏰ ${escapeHtml(assignment.session_start_at ? new Date(assignment.session_start_at).toLocaleString('vi-VN') : 'Theo lịch phòng')}
            </p>
          </div>
          <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
            <span class="badge badge-green" style="font-size: 0.88rem; padding: 6px 12px;">
              Đã tham gia: ${presentCount} / ${players.length} người
            </span>
            ${assignment.session_id ? `
              <button class="btn btn-gold btn-sm" id="btn-start-play" style="padding: 8px 16px;">
                🎬 Bắt đầu ca chơi
              </button>
              <button class="btn btn-ghost btn-sm" id="btn-finish-play" style="padding: 8px 14px;">
                Hoàn thành ca
              </button>
            ` : ''}
          </div>
        </div>

        <h4 style="font-family: var(--font-display); font-size: 1.15rem; color: var(--gold); margin-bottom: 12px;">
          Bảng Điểm Danh Người Chơi Tại Quán
        </h4>

        <div class="table-wrap" style="background: rgba(0,0,0,0.25); border-radius: 8px; border: 1px solid rgba(255,255,255,0.08); overflow-x: auto;">
          <table class="data-table" style="width: 100%;">
            <thead>
              <tr>
                <th>Vị trí</th>
                <th>Họ và tên</th>
                <th>Số điện thoại</th>
                <th>Cọc 50k</th>
                <th>Trạng thái ghế</th>
              </tr>
            </thead>
            <tbody>
              ${players.length === 0 ? `
                <tr><td colspan="5" style="text-align: center; padding: 20px;" class="text-muted">Chưa có người chơi nào trong phòng.</td></tr>
              ` : players.map((p, idx) => `
                <tr>
                  <td style="font-family: var(--font-mono); color: var(--gold);">Ghế #${idx + 1}</td>
                  <td><strong>${escapeHtml(p.name || p.full_name || 'Người chơi')}</strong> ${p.is_creator ? '<span class="badge" style="font-size: 0.7rem; margin-left: 4px;">Host</span>' : ''}</td>
                  <td><a href="${sanitizeUrl('tel:' + (p.phone || '0901234567'))}" class="text-gold" style="text-decoration: underline;">${escapeHtml(p.phone || 'Chưa cập nhật')}</a></td>
                  <td>
                    <span class="badge ${p.status === 'DEPOSITED' ? 'badge-green' : 'badge-18'}">
                      ${p.status === 'DEPOSITED' ? 'Đã cọc 50k' : 'Chờ cọc'}
                    </span>
                  </td>
                  <td>
                    <span class="badge badge-gold" style="font-size: 0.75rem;">
                      ${escapeHtml(p.status)}
                    </span>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;

      if (assignment.session_id) {
        document.getElementById('btn-start-play')?.addEventListener('click', async () => {
          try {
            await api.post(`/sessions/${assignment.session_id}/start`);
            toast.success(`Ca chơi #${room.id} chính thức BẮT ĐẦU! Chúc các thám tử phá án thành công.`);
            renderDmAssignmentsList();
          } catch (err) {
            toast.error(err.message || 'Lỗi bắt đầu ca chơi');
          }
        });
        document.getElementById('btn-finish-play')?.addEventListener('click', async () => {
          const notes = prompt('Nhập kết quả buổi chơi (hoặc bấm OK để tiếp tục):', 'Người chơi phá án thành công.');
          if (notes === null) return;
          const incident = prompt('Ghi nhận sự cố / hỏng đạo cụ (nếu có, hoặc bấm OK nếu không có):', '');
          if (incident === null) return;
          try {
            await api.post(`/sessions/${assignment.session_id}/complete`, {
              session_notes: notes.trim() || undefined,
              incident_report: incident.trim() || undefined,
            });
            toast.info(`Ca chơi #${room.id} đã hoàn thành. Kết quả ca trực được lưu vào hệ thống.`);
            renderDmAssignmentsList();
          } catch (err) {
            toast.error(err.message || 'Lỗi kết thúc ca chơi');
          }
        });
      }
    }

    // Modal reject events
    document.getElementById('btn-close-reject-dialog')?.addEventListener('click', () => {
      document.getElementById('dm-reject-dialog').close();
    });
    document.getElementById('btn-cancel-reject')?.addEventListener('click', () => {
      document.getElementById('dm-reject-dialog').close();
    });
    document.getElementById('dm-reject-form')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const assignId = document.getElementById('dm-reject-assign-id').value;
      const reason = document.getElementById('dm-reject-reason').value.trim();
      try {
        await api.post(`/dm/assignments/${assignId}/reject`, { reason });
        toast.info(`Đã gửi lý do từ chối ca #${assignId} về Quản Trị Viên.`);
        document.getElementById('dm-reject-dialog').close();
        renderDmAssignmentsList();
      } catch (err) {
        toast.error(err.message || 'Lỗi gửi từ chối ca');
      }
    });

    initDmPage();
  </script>
</body>
</html>
