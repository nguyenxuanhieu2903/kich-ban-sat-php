services:
  db:
    image: mysql:8.4
    container_name: kbs_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: kich_ban_sat_v3
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/database/kich_ban_sat_v3_clean.sql:/docker-entrypoint-initdb.d/init.sql

  web:
    build: .
    container_name: kbs_app
    restart: always
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: kich_ban_sat_v3
      DB_USERNAME: root
      DB_PASSWORD: root
    depends_on:
      - db

volumes:
  db_data:
