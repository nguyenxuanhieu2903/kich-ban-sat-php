services:
  db:
    image: mysql:8.4
    container_name: kbs_mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Ho_Chi_Minh
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: kich_ban_sat_v3
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+07:00
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/database/kich_ban_sat_v3_clean.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  web:
    build: .
    container_name: kbs_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      TZ: Asia/Ho_Chi_Minh
      APP_ENV: local
      APP_DEBUG: "true"
      APP_TIMEZONE: Asia/Ho_Chi_Minh
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: kich_ban_sat_v3
      DB_USERNAME: root
      DB_PASSWORD: root
    volumes:
      - uploads_data:/var/www/backend/storage/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  uploads_data:
